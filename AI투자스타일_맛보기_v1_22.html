/* =========================================================================
   AI 맛보기 서비스 v1.11 — 「AI맛보기서비스 화면구성 v1.05_260803」 기준
   ========================================================================= */

:root{
  /* --- 색상 토큰 --- */
  --color-primary:#00755F;
  --color-primary-dark:#00584A;
  --color-accent:#00A57F;
  --color-accent-soft:#7CCFB6;
  --color-primary-tint:#D6EEE5;
  --color-primary-wash:#EDF7F3;

  --color-text:#111417;
  --color-text-strong:#000000;
  --color-text-body:#2E3338;
  --color-text-subtle:#5C646C;
  --color-text-muted:#868E96;
  --color-text-faint:#ADB5BD;

  --color-border:#E7EAED;
  --color-border-soft:#F1F3F5;
  --color-surface:#FFFFFF;
  --color-surface-alt:#F7F9FA;
  --color-background:#EEF1F3;

  --color-warning:#B37211;
  --color-warning-bg:#FFF8EC;
  --color-warning-border:#FBE3B8;
  --color-danger:#C0392B;

  /* --- 반경 --- */
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:18px;
  --radius-xl:24px;
  --radius-pill:999px;

  /* --- 그림자 --- */
  --shadow-card:0 1px 2px rgba(17,20,23,.04), 0 8px 24px rgba(17,20,23,.05);
  --shadow-cta:0 6px 18px rgba(0,117,95,.26);
  --shadow-modal:0 -8px 40px rgba(17,20,23,.18);
  --shadow-pop:0 10px 32px rgba(17,20,23,.20);

  /* --- 간격 --- */
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --space-7:32px;

  --pad:20px;
  --tap:44px;                 /* 최소 터치 영역 */

  --font:AIStyleSans, "Pretendard Variable", Pretendard, -apple-system,
        BlinkMacSystemFont, "Apple SD Gothic Neo", "Nanum Gothic", NanumGothic,
        "Malgun Gothic", system-ui, sans-serif;

  --dur-fast:.16s;
  --dur:.26s;
  --dur-slow:.34s;
}

@media (prefers-reduced-motion: reduce){
  :root{ --dur-fast:.01s; --dur:.01s; --dur-slow:.01s; }
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important;
                        transition-duration:.01ms !important; scroll-behavior:auto !important; }
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); color:var(--color-text);
  background:var(--color-background); -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em; font-weight:400;
  font-synthesis:none; -webkit-font-synthesis:none;
  word-break:keep-all; overflow-wrap:break-word;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
ol,ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
svg{flex:none}

/* 키보드 포커스만 표시 */
:focus{outline:none}
:focus-visible{
  outline:2.5px solid var(--color-accent); outline-offset:2px; border-radius:6px;
}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ---------------------------------------------------------------- 디바이스 */
/* v1.15 — 목업 폰 프레임 제거. 실제 모바일 화면에 그대로 얹히는 레이아웃.
   넓은 화면(PC/태블릿)에서는 모바일 폭(최대 480px)으로 중앙 정렬만 한다. */
.stage{
  display:flex; justify-content:center;
  min-height:100dvh;
}
.device{
  position:relative; flex:1 1 auto; width:100%; max-width:480px;
  min-height:100dvh;
  background:var(--color-surface); overflow:hidden;
  display:flex; flex-direction:column;
  /* 모달·시트의 포지셔닝 기준 */
  isolation:isolate;
}
.page{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden; position:relative;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.page::-webkit-scrollbar{display:none}

/* ------------------------------------------------------------------ 공통 */
.screen{min-height:100%; display:flex; flex-direction:column; animation:fade var(--dur) ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.appbar{
  flex:none; display:flex; align-items:center; gap:2px;
  padding:4px var(--space-3) 8px; min-height:52px;
}
.appbar .title{font-size:17px;font-weight:700;letter-spacing:-.03em}
.icon-btn{
  width:var(--tap);height:var(--tap);border-radius:12px;
  display:grid;place-items:center;color:var(--color-text);flex:none;
  transition:background var(--dur-fast);
}
.icon-btn:hover{background:var(--color-border-soft)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.boxed{
  width:40px;height:40px;background:var(--color-surface);border:1px solid var(--color-border);
  box-shadow:0 1px 3px rgba(17,20,23,.06);color:var(--color-primary);
}

.body{flex:1 1 auto;padding:0 var(--pad) var(--space-6)}
.footer-cta{
  flex:none; padding:var(--space-3) var(--pad)
           calc(var(--space-6) + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(255,255,255,0),var(--color-surface) 26%);
  position:sticky; bottom:0; z-index:3;
}

.btn{
  width:100%; min-height:54px; border-radius:var(--radius-md);
  font-size:17px; font-weight:700; letter-spacing:-.02em;
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  padding:10px 16px; transition:transform var(--dur-fast), background var(--dur-fast);
}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{cursor:not-allowed}
.btn-primary{background:var(--color-primary);color:#fff;box-shadow:var(--shadow-cta)}
.btn-primary:disabled{background:#DDE2E5;color:#98A1A8;box-shadow:none}
.btn-ghost{background:var(--color-surface);color:var(--color-primary);border:1.4px solid var(--color-accent-soft)}
.btn-ghost:disabled{border-color:var(--color-border);color:var(--color-text-faint)}
.btn-quiet{background:var(--color-surface-alt);color:var(--color-text-subtle);border:1px solid var(--color-border)}
.btn-link{
  min-height:var(--tap); font-size:14px; font-weight:600; color:var(--color-text-subtle);
  text-decoration:underline; text-underline-offset:3px;
}
.btn-sm{min-height:38px;font-size:14px;border-radius:var(--radius-sm)}

.sec-title{font-size:17px;font-weight:800;letter-spacing:-.03em;margin:var(--space-6) 0 var(--space-3)}
.sec-title.tight{margin-bottom:var(--space-2)}
.sec-sub{font-size:12.5px;color:var(--color-text-muted);line-height:1.55;margin-bottom:var(--space-3)}
.note{font-size:11.5px;color:var(--color-text-faint);line-height:1.55;margin-top:var(--space-3)}

.toast{
  position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
  max-width:calc(100% - 48px);
  background:rgba(17,20,23,.92); color:#fff; font-size:13px; font-weight:600;
  padding:11px 18px; border-radius:var(--radius-pill); z-index:90;
  animation:fade var(--dur-fast) ease both; text-align:center; line-height:1.5;
}

/* ========================================================== 0. 진입점 (홈) */
.home{background:#EDF3F2}
.home-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);
  padding:2px var(--pad) var(--space-3);background:var(--color-surface);
}
.home-idx{font-size:13px;font-weight:700;color:var(--color-text-faint);line-height:1.6}
.home-idx b{color:var(--color-text)}
.home-idx .up{color:#E5484D;margin-left:5px}
.home-icons{display:flex;gap:var(--space-2);color:var(--color-text-subtle)}

.hero{
  margin:var(--space-4) var(--pad) 0; padding:22px 18px 18px;
  border-radius:var(--radius-xl);
  background:linear-gradient(140deg,#E9F6F1 0%,#DCF0EA 55%,#CBE9DF 100%);
  border:1px solid rgba(0,117,95,.10); position:relative; text-align:center;
}
.hero-close{
  position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;color:var(--color-text-muted);
}
.hero-close:hover{background:rgba(255,255,255,.6)}
.hero h2{
  font-size:20px;font-weight:800;line-height:1.38;letter-spacing:-.035em;
  padding:0 28px;
}
.hero h2 .accent{color:var(--color-primary);display:block}
.hero-art{margin:var(--space-4) auto var(--space-4);display:block;max-width:100%;height:auto}
.hero .btn{
  min-height:48px;background:var(--color-surface);color:var(--color-primary);
  font-size:15.5px;font-weight:800;box-shadow:0 2px 8px rgba(0,72,60,.14);
}

.quickbar{display:flex;gap:var(--space-1);padding:var(--space-5) var(--space-3) var(--space-1)}
.quick{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:11.5px;font-weight:700;color:var(--color-text-body);
  padding:2px;min-height:var(--tap);
}
.quick .qi{
  width:50px;height:50px;border-radius:16px;background:var(--color-surface);
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(17,20,23,.07);
  color:var(--color-text-subtle);transition:transform var(--dur-fast);
}
.quick.on .qi{background:var(--color-primary);color:#fff}
.quick.on{color:var(--color-primary)}
.quick:active .qi{transform:scale(.94)}

.idx-cards{display:flex;gap:var(--space-3);padding:var(--space-5) var(--pad) 0}
.idx-card{flex:1;background:var(--color-surface);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4)}
.idx-card .n{font-size:13px;color:var(--color-text-subtle);font-weight:600}
.idx-card .v{font-size:20px;font-weight:800;color:#1B64DA;margin-top:2px}
.idx-card .d{font-size:12px;color:#1B64DA;font-weight:600}
.home-tabs{
  display:flex;justify-content:space-around;align-items:center;margin-top:auto;
  padding:var(--space-4) var(--pad) calc(var(--space-6) + env(safe-area-inset-bottom,0px));
  color:var(--color-text-faint);font-size:12px;font-weight:700;
}
.home-tabs button{min-width:48px;min-height:44px;padding:6px 8px;border-radius:12px;
  color:inherit;font:inherit;text-align:center}
.home-tabs button:focus-visible{outline:3px solid var(--color-primary-tint);outline-offset:2px}
.home-tabs button.on{color:var(--color-text);background:rgba(255,255,255,.62)}

/* ======================================================== 1. 서비스 인트로 */
.intro{background:linear-gradient(180deg,#FFFFFF 0%,#F4FAF8 58%,#EDF7F3 100%)}
.intro .body{display:flex;flex-direction:column;justify-content:center;text-align:center}
.intro .eyebrow{font-size:15.5px;font-weight:800;color:var(--color-primary)}
.intro h2{margin-top:var(--space-2);font-size:30px;font-weight:800;line-height:1.28;letter-spacing:-.04em}
.intro h2 .accent{color:#008A6E;display:block}
.intro .lead{margin-top:var(--space-3);font-size:13.5px;line-height:1.68;color:var(--color-text-subtle)}
.intro-art{margin:var(--space-2) auto 0;display:block;max-width:100%;height:auto}
.intro-resume{
  margin:var(--space-4) auto 0;display:inline-flex;align-items:center;gap:6px;
  background:var(--color-primary-wash);border:1px solid var(--color-primary-tint);
  color:var(--color-primary);font-size:12.5px;font-weight:700;
  padding:8px 14px;border-radius:var(--radius-pill);
}

/* ============================================================== 2. 설문 */
.progress-wrap{padding:0 var(--pad) 2px}
.progress{height:5px;border-radius:3px;background:var(--color-border-soft);overflow:hidden}
.progress i{display:block;height:100%;border-radius:3px;background:var(--color-accent);
            transition:width var(--dur-slow) cubic-bezier(.4,0,.2,1)}
.q-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-5);padding:var(--space-6) 0 0}
.q-head h2{font-size:21px;font-weight:800;line-height:1.42;letter-spacing:-.035em;flex:1}
.q-step{font-size:18px;font-weight:800;color:var(--color-text-faint);flex:none;padding-top:3px;white-space:nowrap}
.q-step b{color:var(--color-primary)}
.q-axis{
  display:inline-flex;align-items:center;gap:5px;margin-top:var(--space-3);
  font-size:12px;font-weight:700;color:var(--color-primary);
  background:var(--color-primary-wash);border-radius:var(--radius-pill);padding:6px 12px;
}
.opts{display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-5)}
.opt{
  width:100%;text-align:left;padding:16px 14px;border-radius:var(--radius-md);
  background:var(--color-surface);border:1.5px solid var(--color-border);
  font-size:15.5px;line-height:1.5;font-weight:600;color:var(--color-text-body);
  display:flex;gap:var(--space-3);align-items:flex-start;min-height:var(--tap);
  transition:border-color var(--dur-fast), background var(--dur-fast);
}
.opt .mark{
  width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--color-border);
  display:grid;place-items:center;background:var(--color-surface);
  transition:border-color var(--dur-fast), background var(--dur-fast);
  margin-top:1px;
}
.opt .mark span{font-size:12px;font-weight:800;color:var(--color-text-faint)}
.opt .mark svg{display:none;color:#fff}
.opt:hover{border-color:var(--color-accent-soft)}
.opt[aria-pressed="true"]{border-color:var(--color-accent);background:var(--color-primary-wash);color:var(--color-text)}
.opt[aria-pressed="true"] .mark{background:var(--color-accent);border-color:var(--color-accent)}
.opt[aria-pressed="true"] .mark span{display:none}
.opt[aria-pressed="true"] .mark svg{display:block}

.q-nav{display:flex;gap:var(--space-2)}
.q-nav .btn-prev{flex:0 0 34%}
.q-nav .btn-next{flex:1}

/* ============================================================== 3. 로딩 */
.loading{text-align:center}
/* v1.17 — 로딩 화면 세로 중앙 정렬 */
.loading .body{display:flex;flex-direction:column;align-items:center;
  justify-content:center;justify-content:safe center;padding-bottom:var(--space-7)}
.ring{margin:var(--space-6) auto 0;position:relative;width:186px;height:186px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--color-primary-wash);stroke-width:9}
.ring .bar{fill:none;stroke:var(--color-accent);stroke-width:9;stroke-linecap:round;
           transition:stroke-dashoffset .45s ease}
.ring .core{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:2px}
.ring .pct{font-size:30px;font-weight:800;color:var(--color-primary);letter-spacing:-.03em}
.ring .pct small{font-size:16px}
.ring .cap{font-size:11.5px;font-weight:800;color:var(--color-accent);letter-spacing:.09em}
.loading h2{margin-top:var(--space-6);font-size:21px;font-weight:800;letter-spacing:-.03em}
.loading .lead{margin-top:var(--space-2);font-size:13.5px;line-height:1.62;color:var(--color-text-subtle)}
.steps{margin-top:var(--space-6);display:flex;flex-direction:column;gap:var(--space-3);text-align:left}
.step{display:flex;align-items:center;gap:var(--space-3)}
.step .no{
  width:30px;height:30px;flex:none;border-radius:50%;background:var(--color-border-soft);
  color:var(--color-text-muted);display:grid;place-items:center;font-size:13px;font-weight:800;
  transition:background var(--dur), color var(--dur);
}
.step .box{
  flex:1;display:flex;align-items:center;gap:var(--space-2);padding:13px var(--space-3);
  border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border);
  font-size:13.5px;font-weight:600;color:var(--color-text-subtle);
  transition:background var(--dur), border-color var(--dur), color var(--dur);
}
.step .box span{flex:1}
.step.on .no{background:var(--color-primary);color:#fff}
.step.on .box{background:var(--color-primary-wash);border-color:var(--color-primary-tint);
              color:var(--color-primary);font-weight:800}
.step.done .no{background:var(--color-primary-tint);color:var(--color-primary)}
.step .mk{width:16px;height:16px;flex:none;position:relative}
.step .mk::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--color-border);border-top-color:var(--color-accent);
  animation:spin .8s linear infinite;
}
.step.done .mk::before{animation:none;border:0}
.step.done .mk::after{
  content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;
  border:solid var(--color-accent);border-width:0 2px 2px 0;transform:rotate(42deg);
}
@keyframes spin{to{transform:rotate(360deg)}}
.safe-note{
  margin-top:var(--space-7);display:inline-flex;align-items:center;gap:var(--space-2);
  font-size:12.5px;color:var(--color-text-muted);font-weight:600;
}
.safe-note .si{width:28px;height:28px;border-radius:9px;background:var(--color-primary-wash);
               display:grid;place-items:center;color:var(--color-primary)}

/* ==================================================== 오버레이 공통 (모달) */
.overlay{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column}
.overlay[hidden]{display:none}
.overlay .dim{position:absolute;inset:0;background:rgba(17,20,23,.5);animation:fade var(--dur) ease both}

/* --- 결과 모달 --- */
.modal{
  position:absolute;left:0;right:0;bottom:0;top:0;
  background:var(--color-surface);display:flex;flex-direction:column;overflow:hidden;
  animation:modal-in var(--dur-slow) cubic-bezier(.2,.8,.25,1) both;
}
@keyframes modal-in{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.modal.closing{animation:modal-out var(--dur) ease both}
@keyframes modal-out{to{opacity:0;transform:translateY(10px)}}
.modal-head{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);
  padding:calc(var(--space-2) + env(safe-area-inset-top,0px)) var(--space-2) var(--space-2) var(--pad);
  border-bottom:1px solid var(--color-border-soft);
}
.modal-head h2{font-size:16px;font-weight:800;letter-spacing:-.03em}
.modal-body{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 var(--pad) var(--space-4);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.modal-body::-webkit-scrollbar{display:none}
.modal-foot{
  flex:none;padding:var(--space-3) var(--pad) calc(var(--space-4) + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--color-border-soft);background:var(--color-surface);
  display:flex;flex-direction:column;gap:var(--space-1);
}

/* --- 결과 상단 --- */
.res-kicker{font-size:14px;font-weight:700;color:var(--color-text-subtle);margin-top:var(--space-5)}
.type-card{
  margin-top:var(--space-3);padding:22px 18px;border-radius:var(--radius-lg);
  background:linear-gradient(160deg,#FBFEFD 0%,#F1F9F6 100%);
  border:1px solid var(--color-primary-tint);text-align:center;
}
.type-code{display:flex;justify-content:center;gap:14px;margin-bottom:var(--space-3)}
.type-code span{
  width:38px;height:44px;border-radius:11px;background:var(--color-surface);
  border:1px solid var(--color-primary-tint);
  display:grid;place-items:center;font-size:22px;font-weight:800;color:#008A6E;
  animation:pop .38s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.86)}to{opacity:1;transform:none}}
.type-name{font-size:25px;font-weight:800;color:#008A6E;letter-spacing:-.04em;line-height:1.28}
.type-def{margin-top:var(--space-2);font-size:14px;color:var(--color-text-body);line-height:1.55;font-weight:600}
.type-tag{margin-top:6px;font-size:12.5px;color:var(--color-text-muted);line-height:1.6}
.type-stats{display:flex;gap:var(--space-2);margin-top:var(--space-4)}
.type-stat{flex:1;background:var(--color-surface);border:1px solid var(--color-border);
           border-radius:12px;padding:11px 6px}
.type-stat .k{font-size:11.5px;color:var(--color-text-muted);font-weight:600}
.type-stat .v{font-size:17px;font-weight:800;color:var(--color-primary);margin-top:3px}
.type-stat .v small{font-size:12px;font-weight:700;color:var(--color-text-muted);margin-left:1px}
.type-stats-cap{margin-top:7px;font-size:11px;color:var(--color-text-faint);text-align:center;
  letter-spacing:-.01em}

/* --- 4가지 기준 축 --- */
.axes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.axis{background:var(--color-surface);border:1px solid var(--color-border);
      border-radius:12px;padding:9px 4px 7px}
.axis-h{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
        font-weight:800;color:var(--color-text-body);margin-bottom:7px;text-align:center;line-height:1.25}
.axis-h svg{color:var(--color-primary)}
.pole{
  border-radius:9px;border:1.4px solid var(--color-border-soft);background:var(--color-surface-alt);
  padding:8px 2px;text-align:center;margin-bottom:5px;
}
.pole:last-child{margin-bottom:0}
.pole .c{font-size:17px;font-weight:800;color:var(--color-text-faint);line-height:1.1}
.pole .l{font-size:10.5px;font-weight:700;color:var(--color-text-muted);margin-top:2px}
.pole .s{font-size:9px;color:var(--color-text-faint);margin-top:1px;letter-spacing:-.04em}
.pole.on{background:var(--color-primary-wash);border-color:var(--color-accent)}
.pole.on .c{color:#008A6E}
.pole.on .l{color:var(--color-primary);font-weight:800}
.pole.on .s{color:#008A6E}
.pole .badge{display:block;font-size:8.5px;font-weight:800;color:var(--color-primary);margin-top:2px}

/* --- 강점 / 유의점 --- */
.pc-list{display:flex;flex-direction:column;gap:var(--space-3)}
.pc{display:flex;gap:var(--space-3);padding:15px 14px;border-radius:var(--radius-md)}
.pc.good{background:var(--color-primary-wash);border:1px solid var(--color-primary-tint)}
.pc.warn{background:var(--color-warning-bg);border:1px solid var(--color-warning-border)}
.pc .pi{width:34px;height:34px;flex:none;border-radius:50%;background:var(--color-surface);
        display:grid;place-items:center}
.pc.good .pi{color:var(--color-primary)}
.pc.warn .pi{color:var(--color-warning)}
.pc h3{font-size:14.5px;font-weight:800;margin-bottom:7px}
.pc.good h3{color:var(--color-primary)}
.pc.warn h3{color:var(--color-warning)}
.pc li{font-size:13px;line-height:1.62;color:var(--color-text-body);padding-left:11px;
  text-align:justify;word-break:normal;overflow-wrap:break-word;
       position:relative;margin-bottom:6px}
.pc li:last-child{margin-bottom:0}
.pc li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;
               border-radius:50%;background:var(--color-text-faint)}

/* --- 매매 패턴 지표 --- */
.title-row{display:flex;align-items:center;gap:6px;margin:var(--space-6) 0 var(--space-3)}
.title-row h3{font-size:17px;font-weight:800;letter-spacing:-.03em}
/* 시각 크기는 32px 유지하되 터치 영역은 44px 확보 (음수 마진으로 줄 높이 보정) */
.info-btn{
  width:var(--tap);height:var(--tap);margin:-6px 0 -6px -6px;
  border-radius:50%;display:grid;place-items:center;
  color:var(--color-text-faint);flex:none;
}
.info-btn svg{pointer-events:none}
.info-btn:hover{color:var(--color-primary);background:var(--color-primary-wash)}
.info-btn[aria-expanded="true"]{color:var(--color-primary);background:var(--color-primary-wash)}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
.metric{background:var(--color-surface);border:1px solid var(--color-border);
        border-radius:var(--radius-md);padding:13px 5px 11px;text-align:center}
.metric .mi{width:32px;height:32px;margin:0 auto 7px;border-radius:10px;
            background:var(--color-primary-wash);display:grid;place-items:center;color:var(--color-primary)}
.metric .k{font-size:11px;color:var(--color-text-subtle);font-weight:600;line-height:1.35;
           min-height:2.7em;display:flex;align-items:center;justify-content:center;padding:0 2px}
.metric .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.03em}
.metric .v small{font-size:11.5px;font-weight:700;color:var(--color-text-muted);margin-left:1px}

.tip{
  margin-top:var(--space-3);background:var(--color-text);color:#fff;border-radius:var(--radius-md);
  padding:14px 15px;position:relative;animation:fade var(--dur-fast) ease both;
}
.tip::before{
  content:"";position:absolute;top:-6px;left:26px;width:12px;height:12px;
  background:var(--color-text);transform:rotate(45deg);border-radius:2px;
}
.tip dl{display:flex;flex-direction:column;gap:9px;margin:0}
.tip dt{font-size:12.5px;font-weight:800;color:#fff}
.tip dd{margin:2px 0 0;font-size:12px;line-height:1.55;color:rgba(255,255,255,.78)}
.tip-close{margin-top:var(--space-3);width:100%;min-height:36px;border-radius:var(--radius-sm);
           background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:700}

/* --- 최다 보유 테마 TOP3 --- */
.theme-card{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-md);padding:14px;margin-bottom:var(--space-3);
  box-shadow:var(--shadow-card);
}
.theme-card:last-of-type{margin-bottom:0}
.tc-head{display:flex;align-items:flex-start;gap:var(--space-3)}
.tc-rank{
  width:26px;height:26px;flex:none;border-radius:8px;background:var(--color-primary-wash);
  color:var(--color-primary);display:grid;place-items:center;font-size:13px;font-weight:800;
}
.tc-name{flex:1;font-size:15.5px;font-weight:800;letter-spacing:-.03em;line-height:1.35;min-width:0}
.tc-kw{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;padding-left:38px}
.tc-kw span{
  background:var(--color-primary-wash);color:var(--color-primary);font-size:11px;
  font-weight:700;padding:4px 8px;border-radius:6px;
}
.tc-bar{display:flex;align-items:center;gap:10px;margin-top:11px;padding-left:38px}
.tc-bar .t{flex:1;height:8px;border-radius:5px;background:var(--color-border-soft);overflow:hidden}
.tc-bar .t i{display:block;height:100%;border-radius:5px;background:var(--color-primary);
             width:0;transition:width .85s cubic-bezier(.2,.8,.3,1)}
.tc-bar .p{font-size:15px;font-weight:800;color:var(--color-primary);min-width:50px;text-align:right}
.tc-bar .p small{font-size:11px;margin-left:1px}
.tc-foot{margin-top:12px;padding-left:38px}
.tc-foot .btn{min-height:38px;font-size:13.5px;border-radius:var(--radius-sm)}
.tc-foot .off{
  min-height:38px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);background:var(--color-surface-alt);
  border:1px solid var(--color-border);color:var(--color-text-faint);
  font-size:13px;font-weight:700;
}

  /* ---------------------------------------------------------------- utils */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function qs(sel, root) { return (root || document).querySelector(sel); }
  function qsa(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }
  function on(el, ev, fn, opts) { if (el) el.addEventListener(ev, fn, opts); }
  function fmtDate(v) {
    var s = String(v || '');
    return s.length === 8 ? s.slice(0, 4) + '.' + s.slice(4, 6) + '.' + s.slice(6) : s;
  }
  function periodText() {
    var p = D.meta.period || {};
    return p.from && p.to ? fmtDate(p.from) + ' ~ ' + fmtDate(p.to) : '';
  }

  /* 타이머 정리 */
  var timers = [];
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  /* 연속 클릭 방지 */
  var clickLock = 0;
  function guard() {
    var now = Date.now();
    if (now - clickLock < CONFIG.CLICK_LOCK_MS) return false;
    clickLock = now;
    return true;
  }

  /* -------------------------------------------------------------- storage */
  var memStore = null;
  var storage = {
    available: (function () {
      try {
        var k = '__t' + Date.now();
        window.sessionStorage.setItem(k, '1');
        window.sessionStorage.removeItem(k);
        return true;
      } catch (e) { return false; }
    })(),
    read: function () {
      if (!this.available) return memStore;
      try {
        var raw = window.sessionStorage.getItem(CONFIG.STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return memStore; }
    },
    write: function (obj) {
      memStore = obj;
      if (!this.available) return;
      try { window.sessionStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(obj)); }
      catch (e) { /* 용량 초과 등 — 메모리 상태로만 유지 */ }
    },
    clear: function () {
      memStore = null;
      if (!this.available) return;
      try { window.sessionStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) {}
    }
  };

  /* ---------------------------------------------------------------- state */
  var SEG_BY_FLAT = {};
  D.segments.forEach(function (s) { if (s && s.flat) SEG_BY_FLAT[s.flat] = s; });

  var state = {
    page: 'home',        // home | intro | survey | loading
    qi: 0,
    answers: new Array(D.questions.length).fill(null),
    seg: null,
    started: false,
    bannerClosed: false,
    sharedMode: false,            // 공유 파일로 열린 상태
    ignoreEmbeddedShare: false    // '나도 해보기' 이후 현재 세션에서 공유 모드 무시
  };

  function persist() {
    storage.write({
      qi: state.qi,
      answers: state.answers,
      segCode: state.seg ? state.seg.flat : null,
      started: state.started
    });
  }
  function restore() {
    var s = storage.read();
    if (!s || typeof s !== 'object') return false;
    var answers = arr(s.answers);
    if (answers.length !== D.questions.length) return false;
    state.answers = answers.slice();
    state.qi = Math.min(Math.max(0, s.qi | 0), Math.max(0, D.questions.length - 1));
    state.started = !!s.started;
    state.seg = (s.segCode && SEG_BY_FLAT[s.segCode]) || null;
    return true;
  }
  function resetSurvey() {
    state.qi = 0;
    state.answers = new Array(D.questions.length).fill(null);
    state.seg = null;
    state.started = false;
    storage.clear();
  }
  function answeredCount() {
    return state.answers.filter(function (a) { return !!a; }).length;
  }

  function defaultSeg() {
    return SEG_BY_FLAT[CONFIG.DEFAULT_SEG] || D.segments[0] || null;
  }
  function segByCode(code) {
    var flat = String(code || '').replace(/-/g, '').toUpperCase();
    return SEG_BY_FLAT[flat] || null;
  }

  /* 12문항 → 축별 다수결 → 세그먼트 */
  function scoreAnswers(answers) {
    var tally = {};
    arr(answers).forEach(function (c) { if (c) tally[c] = (tally[c] || 0) + 1; });
    var flat = D.axes.map(function (ax) {
      var poles = arr(ax.poles);
      var a = poles[0] ? poles[0].code : '';
      var b = poles[1] ? poles[1].code : '';
      return (tally[a] || 0) >= (tally[b] || 0) ? a : b;
    }).join('');
    return SEG_BY_FLAT[flat] || defaultSeg();
  }

  /* ------------------------------------------------------- DOM references */
  var deviceEl, pageEl, overlayEl, popupHost, toastEl;

  var toastTimer;
  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, CONFIG.TOAST_MS);
  }

  /* ------------------------------------------------------------ 계좌개설 */
  function openAccount(where) {
    var parts = [];
    try {
      new URLSearchParams(location.search).forEach(function (v, k) {
        if (/^utm_/.test(k)) parts.push(k + '=' + encodeURIComponent(v));
      });
    } catch (e) {}
    parts.push('from=ai_style_' + where);
    if (state.seg) parts.push('seg=' + state.seg.flat);
    /* 데모: 실제 서비스에서는 비대면 계좌개설 URL로 이동 */
    toast('비대면 계좌개설 화면으로 이동합니다\n(' + parts.join('&') + ')');
  }

  /* =====================================================================
     오버레이 매니저 — 결과 모달 / 바텀시트 / 확인 팝업
     ===================================================================== */
  var overlay = {
    kind: null,          // 'modal' | 'sheet' | null
    lastFocus: null,
    keyHandler: null
  };

  function trapFocus(container, e) {
    var f = qsa('button:not([disabled]), [href], summary, [tabindex]:not([tabindex="-1"])', container)
      .filter(function (el) { return el.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function bindOverlayKeys(container, onEsc) {
    unbindOverlayKeys();
    overlay.keyHandler = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); onEsc(); }
      else if (e.key === 'Tab') { trapFocus(container, e); }
    };
    document.addEventListener('keydown', overlay.keyHandler);
  }
  function unbindOverlayKeys() {
    if (overlay.keyHandler) {
      document.removeEventListener('keydown', overlay.keyHandler);
      overlay.keyHandler = null;
    }
  }

  /* ------------------------------------------------------------ 확인 팝업 */
  var popupKeyHandler = null;
  function closePopup() {
    if (!popupHost) return;
    popupHost.innerHTML = '';
    popupHost.hidden = true;
    if (popupKeyHandler) {
      document.removeEventListener('keydown', popupKeyHandler);
      popupKeyHandler = null;
    }
    /* 공유 선택창에서 만든 임시 Blob URL을 정리한다. */
    if (typeof releaseActiveSharePackage === 'function') releaseActiveSharePackage();
  }
  function showPopup(opts) {
    if (!popupHost) return;
    closePopup();
    var id = 'popup-title';
    popupHost.hidden = false;
    popupHost.innerHTML =
      '<div class="dim" data-popup-dismiss></div>' +
      '<div class="popup" role="alertdialog" aria-modal="true" aria-labelledby="' + id + '">' +
        '<h3 id="' + id + '">' + esc(opts.title) + '</h3>' +
        (opts.body ? '<p>' + esc(opts.body) + '</p>' : '') +
        '<div class="popup-actions">' +
          '<button type="button" class="btn btn-quiet" data-popup="cancel">' + esc(opts.cancel || '아니요') + '</button>' +
          '<button type="button" class="btn btn-primary" data-popup="ok">' + esc(opts.ok || '네') + '</button>' +
        '</div>' +
      '</div>';

    var okBtn = qs('[data-popup="ok"]', popupHost);
    var cancelBtn = qs('[data-popup="cancel"]', popupHost);
    on(okBtn, 'click', function () { closePopup(); if (opts.onOk) opts.onOk(); });
    on(cancelBtn, 'click', function () { closePopup(); if (opts.onCancel) opts.onCancel(); });
    on(qs('[data-popup-dismiss]', popupHost), 'click', function () {
      closePopup(); if (opts.onCancel) opts.onCancel();
    });

    popupKeyHandler = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); closePopup(); if (opts.onCancel) opts.onCancel(); }
      else if (e.key === 'Tab') { trapFocus(popupHost, e); }
    };
    document.addEventListener('keydown', popupKeyHandler);
    if (cancelBtn) cancelBtn.focus();
  }

  /* =====================================================================
     화면 전환
     ===================================================================== */
  var PAGES = {};

  function go(page) {
    if (!PAGES[page]) page = 'home';

    PAGES[page]();

  /* ========================================================= 1. 서비스 인트로 */

    var answeredN = answeredCount();

        /* v1.15: 실제 앱/웹뷰에 얹히는 화면 — 자체 상태바·뒤로가기 헤더 없이 콘텐츠부터 시작 */

          '<p class="eyebrow">하나증권 AI 서비스 맛보기</p>' +

          '<p class="lead">간단한 질문으로 나의 투자 스타일을 파악하고<br>' +
            '나의 투자 장단점과 AI가 생성한 투자 정보를 경험해보세요!</p>' +
          introArt() +
          (finished
            ? '<p class="intro-resume">' + I.check + '지난 설문 결과가 저장돼 있어요</p>'

              ? '<p class="intro-resume">' + I.check + '이어서 ' + (state.qi + 1) + '번 문항부터 진행할 수 있어요</p>'
              : '') +
        '</div>' +
        '<div class="footer-cta">' +
          '<button type="button" class="btn btn-primary" data-act="start">' +
            (resuming ? '이어서 계속하기' : '나의 투자 스타일 알아보기') + '</button>' +
        '</div>' +
      '</div>';

    on(qs('[data-act="start"]', pageEl), 'click', startSurvey);
  };

  /* v1.15: 목업 홈 화면은 노출 흐름에서 제거 — 남은 경로가 있어도 인트로로 우회 */
  PAGES.home = function () { PAGES.intro(); };

  /* 설문 시작 — 진행 중이면 그 문항부터 재개 */
  function startSurvey() {
    var answered = answeredCount();
    var total = D.questions.length;

    /* v1.19 — 이전 설문 기록이 있으면 이어하기 / 처음부터 선택 */
    if (state.started && answered > 0) {
      var finished = answered >= total && state.seg;
      showChoicePopup(finished
        ? {
            icon: 'check',
            title: '지난 설문 결과가 있어요',
            body: '설문을 모두 마치고 결과까지 확인하셨어요.\n어떻게 할까요?',
            primary: { label: '이전 결과 다시 보기', act: function () {
              state.page = 'intro'; PAGES.intro(); openResultModal();
            } },
            secondary: { label: '처음부터 다시 하기', act: function () {
              resetSurvey(); state.started = true; persist(); go('survey');
            } }
          }
        : {
            icon: 'edit',
            title: '진행하던 설문이 있어요',
            body: total + '개 문항 중 ' + answered + '개까지 답하셨어요.\n이어서 진행할까요?',
            primary: { label: '이어서 진행하기', act: function () {
              persist(); go('survey');
            } },
            secondary: { label: '처음부터 다시 하기', act: function () {
              resetSurvey(); state.started = true; persist(); go('survey');
            } }
          });
      return;
    }

    resetSurvey();
    state.started = true;
    persist();
    go('survey');
  }

  /* 두 가지 행동 중 하나를 고르는 선택 팝업 (확인/취소형 showPopup 과 구분) */
  function showChoicePopup(opts) {
    if (!popupHost) return;
    closePopup();
    var id = 'popup-title';
    popupHost.hidden = false;
    popupHost.innerHTML =
      '<div class="dim" data-popup-dismiss></div>' +
      '<div class="popup choice-popup" role="alertdialog" aria-modal="true" aria-labelledby="' + id + '">' +
        '<span class="choice-ic">' + (I[opts.icon] || I.check) + '</span>' +
        '<h3 id="' + id + '">' + esc(opts.title) + '</h3>' +
        (opts.body ? '<p>' + esc(opts.body).replace(/\n/g, '<br>') + '</p>' : '') +
        '<div class="choice-actions">' +
          '<button type="button" class="btn btn-primary" data-popup="ok">' + esc(opts.primary.label) + '</button>' +
          '<button type="button" class="btn btn-ghost" data-popup="cancel">' + esc(opts.secondary.label) + '</button>' +
        '</div>' +
        '<button type="button" class="choice-dismiss" data-popup-dismiss aria-label="닫기">닫기</button>' +
      '</div>';

    var okBtn = qs('[data-popup="ok"]', popupHost);
    on(okBtn, 'click', function () { closePopup(); opts.primary.act(); });
    on(qs('[data-popup="cancel"]', popupHost), 'click', function () { closePopup(); opts.secondary.act(); });
    qsa('[data-popup-dismiss]', popupHost).forEach(function (el) {
      on(el, 'click', function () { closePopup(); });
    });
    popupKeyHandler = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); closePopup(); }
      else if (e.key === 'Tab') { trapFocus(popupHost, e); }
    };
    document.addEventListener('keydown', popupKeyHandler);
    if (okBtn) okBtn.focus();
  }

  /* ============================================================== 2. 설문 */
  PAGES.survey = function () { renderSurvey(); };

  function renderSurvey() {
    var total = D.questions.length;
    if (!total) { go('intro'); return; }
    var i = Math.min(Math.max(0, state.qi), total - 1);
    state.qi = i;
    /* 어떤 경로로 진입했든 설문 화면에 들어오면 '진행 중'으로 표시한다.
       (인트로의 이어하기 안내가 진입 경로와 무관하게 동작하도록) */
    if (!state.started) { state.started = true; persist(); }

    var q = D.questions[i] || {};
    var opts = arr(q.options);
    var axis = D.axes.filter(function (a) {
      return opts[0] && a.key === opts[0].axis;
    })[0] || {};
    var picked = state.answers[i];
    var last = i === total - 1;
    var pct = Math.round(((i + (picked ? 1 : 0)) / total) * 100);

    pageEl.innerHTML =
      '<div class="screen">' +
        '<div class="appbar">' +
          '<button type="button" class="icon-btn" data-act="quit" aria-label="투자 스타일 분석 그만하기">' + I.back + '</button>' +
        '</div>' +
        '<div class="progress-wrap">' +
          '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" ' +
            'aria-valuenow="' + (i + 1) + '" aria-label="설문 진행도">' +
            '<i style="width:' + pct + '%"></i></div>' +
        '</div>' +
        '<div class="body">' +
          '<div class="q-head">' +
            '<h2 id="q-title">' + esc(q.q) + '</h2>' +
            '<p class="q-step"><b>' + String(i + 1).padStart(2, '0') + '</b> / ' + total +
              '<span class="sr-only">번째 문항</span></p>' +
          '</div>' +
          (axis.name ? '<span class="q-axis">' + (I[axis.icon] || '') + esc(axis.name) + '</span>' : '') +
          '<div class="opts" role="group" aria-labelledby="q-title">' +
            opts.map(function (o, oi) {
              var on_ = picked === o.code;
              return '<button type="button" class="opt" data-oi="' + oi + '" aria-pressed="' + on_ + '">' +
                '<span class="mark" aria-hidden="true"><span>' + esc(o.key) + '</span>' + I.check + '</span>' +
                '<span>' + esc(o.text) + '</span></button>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="footer-cta">' +
          '<div class="q-nav">' +
            '<button type="button" class="btn btn-ghost btn-prev" data-act="prev"' +
              (i === 0 ? ' disabled' : '') + '>이전</button>' +
            '<button type="button" class="btn btn-primary btn-next" data-act="next"' +
              (picked ? '' : ' disabled') + '>' + (last ? '분석 결과 보기' : '다음') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var autoPending = false;

    function advanceSurvey() {
      if (!state.answers[i]) return;
      clearTimers();
      autoPending = false;

      if (i === total - 1) {
        state.seg = scoreAnswers(state.answers);
        persist();
        go('loading');
      } else {
        state.qi = i + 1;
        persist();
        renderSurvey();
      }
    }

    qsa('.opt', pageEl).forEach(function (btn) {
      on(btn, 'click', function () {
        if (autoPending) return;
        var o = opts[+btn.dataset.oi];
        if (!o) return;

        clearTimers();
        state.answers[i] = o.code;
        persist();

        qsa('.opt', pageEl).forEach(function (b) {
          var selected = b === btn;
          b.setAttribute('aria-pressed', String(selected));
          b.disabled = true;
        });

        var bar = qs('.progress i', pageEl);
        if (bar) bar.style.width = Math.round(((i + 1) / total) * 100) + '%';

        var next = qs('[data-act="next"]', pageEl);
        if (next) next.disabled = true;

        autoPending = true;
        var delay = REDUCED
          ? CONFIG.SURVEY_AUTO_ADVANCE_MS_REDUCED
          : CONFIG.SURVEY_AUTO_ADVANCE_MS;

        later(function () {
          /* 화면 전환이나 이전 문항 이동 뒤 남은 타이머가 실행되지 않도록 검증 */
          if (state.page !== 'survey' || state.qi !== i) return;
          advanceSurvey();
        }, delay);
      });
    });

    on(qs('[data-act="prev"]', pageEl), 'click', function () {
      clearTimers();
      autoPending = false;
      if (state.qi > 0) { state.qi--; persist(); renderSurvey(); }
    });
    on(qs('[data-act="next"]', pageEl), 'click', function () {
      advanceSurvey();
    });
    on(qs('[data-act="quit"]', pageEl), 'click', function () {
      clearTimers();
      autoPending = false;
      confirmQuitSurvey();
    });
  }

  function confirmQuitSurvey() {
    showPopup({
      title: '투자 스타일 분석을 그만할까요?',
      body: '지금까지 응답한 내용은 저장되지 않아요.',
      cancel: '아니요',
      ok: '네',
      onOk: function () { resetSurvey(); go('intro'); }
    });
  }

  /* ============================================================== 3. 로딩 */
  PAGES.loading = function () {
    if (!state.seg) state.seg = defaultSeg();
    var C = 2 * Math.PI * 82;
    var duration = REDUCED ? CONFIG.LOADING_MS_REDUCED : CONFIG.LOADING_MS;

    pageEl.innerHTML =
      '<div class="screen loading">' +
        '<div class="body">' +
          '<div class="ring">' +
            '<svg viewBox="0 0 186 186" aria-hidden="true">' +
              '<circle class="track" cx="93" cy="93" r="82"/>' +
              '<circle class="bar" cx="93" cy="93" r="82" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/>' +
            '</svg>' +
            '<div class="core"><p class="pct">0<small>%</small></p><p class="cap">AI ANALYZING</p></div>' +
          '</div>' +
          '<h2>투자 스타일을 분석하고 있어요</h2>' +
          '<p class="lead">답변을 바탕으로 맞춤형 분류하고<br>하나증권 고객 데이터와 비교 중이에요.</p>' +
          '<ol class="steps" aria-live="polite">' +
            LOAD_STEPS.map(function (s, n) {
              return '<li class="step" data-i="' + n + '">' +
                '<span class="no" aria-hidden="true">' + (n + 1) + '</span>' +
                '<span class="box">' + I[s.icon] + '<span>' + esc(s.text) + '</span>' +
                '<i class="mk" aria-hidden="true"></i></span></li>';
            }).join('') +
          '</ol>' +
          '<p style="text-align:center"><span class="safe-note">' +
            '<span class="si">' + I.lock + '</span>고객님의 정보는 안전하게 보호됩니다.</span></p>' +
        '</div>' +
      '</div>';

    var bar = qs('.ring .bar', pageEl);
    var pct = qs('.ring .pct', pageEl);
    var steps = qsa('.step', pageEl);
    var t0 = Date.now();

    (function tick() {
      if (state.page !== 'loading') return;              // 화면 전환 시 중단
      var p = Math.min(1, (Date.now() - t0) / duration);
      if (bar) bar.style.strokeDashoffset = String(C * (1 - p));
      if (pct) pct.innerHTML = Math.round(p * 100) + '<small>%</small>';
      var cur = Math.min(steps.length - 1, Math.floor(p * steps.length));
      steps.forEach(function (s, n) {
        s.classList.toggle('on', n === cur);
        s.classList.toggle('done', n < cur);
      });
      if (p < 1) later(tick, CONFIG.LOADING_TICK_MS);
      else {
        steps.forEach(function (s) { s.classList.remove('on'); s.classList.add('done'); });
        later(function () {
          if (state.page !== 'loading') return;
          state.page = 'intro';
          PAGES.intro();
          openResultModal();
        }, REDUCED ? 120 : 340);
      }
    })();
  };

  /* =====================================================================
     결과 모달 (v1.05 슬라이드 10 · 11 통합)
     ===================================================================== */
  function openResultModal() {
    var s = state.seg || (state.seg = defaultSeg());
    if (!s) { go('intro'); return; }

    overlay.lastFocus = document.activeElement;
    overlay.kind = 'modal';
    overlayEl.hidden = false;
    overlayEl.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="res-title">' +
        '<div class="modal-head">' +
          '<h2 id="res-title">투자 스타일 분석결과</h2>' +
          '<button type="button" class="icon-btn" data-act="close-result" aria-label="분석결과 닫고 홈으로">' + I.close + '</button>' +
        '</div>' +
        '<div class="modal-body" id="res-body">' + resultBody(s) + '</div>' +
        '<div class="modal-foot">' +
          '<button type="button" class="btn btn-primary" data-act="open-account">' +
            I.person + '계좌개설하고 상세내용 보기</button>' +
          '<button type="button" class="btn btn-link" data-act="close-result">다음에 하기</button>' +
        '</div>' +
      '</div>';

    bindResultEvents(s);
    bindOverlayKeys(overlayEl, closeResultModal);

    var closeBtn = qs('[data-act="close-result"]', overlayEl);
    if (closeBtn) closeBtn.focus();

    /* 테마 막대는 100% 기준. 렌더 후 애니메이션 */
    later(function () {
      qsa('.tc-bar i', overlayEl).forEach(function (el) {
        var w = parseFloat(el.dataset.w) || 0;
        el.style.width = Math.max(0, Math.min(100, w)) + '%';
      });
    }, 120);
  }

  function closeResultModal() {
    if (overlay.kind !== 'modal') return;
    closeSheet(true);
    var m = qs('.modal', overlayEl);
    var done = function () {
      overlayEl.hidden = true;
      overlayEl.innerHTML = '';
      overlay.kind = null;
      unbindOverlayKeys();
      state.bannerClosed = false;
      go('intro');
    };
    if (m && !REDUCED) { m.classList.add('closing'); later(done, CONFIG.MODAL_CLOSE_MS); }
    else done();
  }

  /* ------------------------------------------------- 공통 렌더 (결과·공유 공용) */

  /* 투자 스타일 카드. showStats=false 면 그룹 통계 수치를 표시하지 않는다(공유 화면). */
  function renderTypeSummary(s, showStats, axisLabel) {
    var flat = String(s.flat || '').split('');
    return '<div class="type-card">' +
        '<div class="type-code" aria-hidden="true">' +
          flat.map(function (c, n) {
            return '<span style="animation-delay:' + (n * 80) + 'ms">' + esc(c) + '</span>';
          }).join('') +
        '</div>' +
        '<h3 class="type-name">' + esc(s.name) + '</h3>' +
        '<p class="sr-only">투자 스타일 코드 ' + esc(flat.join(' ')) + '</p>' +
        '<p class="type-def">' + esc(s.definition) + '</p>' +
        '<p class="type-tag">' + esc(s.tagline) + '</p>' +
        (showStats
          ? '<div class="type-stats">' +
              statBox('하나증권 손님 중', s.share, '%가 이 유형', '%') +
              statBox(D.segments.length + '개 스타일 그룹 중 수익률', s.returnRank,
                      '위, 전체 ' + D.segments.length + '개 투자 스타일 그룹 중 수익률 순위', '위') +
            '</div>' +
            '<p class="type-stats-cap">* 수익률 순위는 ' + D.segments.length +
              '개 투자 스타일 그룹 간 비교 순위예요.</p>'
          : '') +
      '</div>';
  }

  function renderAxisCards(s, mine) {
    var flat = String(s.flat || '').split('');
    return '<div class="axes">' +
      D.axes.map(function (ax, ai) {
        return '<div class="axis">' +

  function bindResultEvents(s) {
    qsa('[data-act="close-result"]', overlayEl).forEach(function (b) {
      on(b, 'click', function () { if (guard()) closeResultModal(); });
    });
    on(qs('[data-act="open-account"]', overlayEl), 'click', function () {
      if (guard()) openAccount('result');
    });
    qsa('[data-act="open-theme"]', overlayEl).forEach(function (b) {
      on(b, 'click', function () { openSheet(arr(s.themes)[+b.dataset.idx], b); });
    });
    on(qs('[data-act="toggle-tip"]', overlayEl), 'click', toggleMetricTip);
    on(qs('[data-act="share-result"]', overlayEl), 'click', handleResultShare);
    on(qs('[data-act="retry-survey"]', overlayEl), 'click', function () {
      if (!guard()) return;
      closeOverlay(true);
      resetSurvey();
      state.started = true;
      persist();
      go('survey');
