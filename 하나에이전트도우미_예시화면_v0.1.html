<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하나 AI에이전트 도우미 — 프로토타입</title>
<style>
  :root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--indigo:#4f46e5;--indigo-bg:#eef2ff;
    --amber:#b45309;--amber-bg:#fffbeb;--emerald:#047857;--emerald-bg:#ecfdf5;--red:#b91c1c;--red-bg:#fef2f2;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:ui-sans-serif,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;}
  .app{display:flex;min-height:100vh;}
  aside{width:256px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:8px;padding:16px;border-bottom:1px solid var(--line);}
  .brand .mk{width:32px;height:32px;border-radius:8px;background:#00857a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .brand .t1{font-size:14px;font-weight:600;line-height:1.2;}
  .brand .t2{font-size:11px;color:var(--muted);}
  nav{flex:1;overflow-y:auto;padding:12px;}
  .grp{font-size:11px;font-weight:600;color:#94a3b8;padding:8px 8px 4px;}
  nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;font-size:13px;color:#334155;cursor:pointer;}
  nav button:hover{background:#f1f5f9;}
  nav button.on{background:var(--ink);color:#fff;}
  nav .ic{width:16px;text-align:center;color:#94a3b8;font-size:13px;}
  nav button.on .ic{color:#fff;}
  main{flex:1;min-width:0;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;}
  .hh{font-size:12px;color:var(--muted);}
  .pill-c{background:var(--amber-bg);color:var(--amber);border:1px solid #fcd34d;border-radius:999px;padding:4px 10px;font-size:11px;}
  .content{flex:1;overflow-y:auto;padding:28px;}
  .inner{max-width:880px;margin:0 auto;}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em;}
  h2{font-size:16px;font-weight:600;}
  .sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6;}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;}
  .pad{padding:16px;}
  .grid{display:grid;gap:12px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:820px){.g2,.g3{grid-template-columns:1fr;} aside{display:none;}}
  .pill{display:inline-flex;align-items:center;border-radius:999px;border:1px solid;padding:2px 8px;font-size:11px;font-weight:500;}
  .p-slate{background:#f1f5f9;color:#475569;border-color:#e2e8f0;}
  .p-indigo{background:var(--indigo-bg);color:#4338ca;border-color:#c7d2fe;}
  .p-amber{background:var(--amber-bg);color:var(--amber);border-color:#fcd34d;}
  .p-emerald{background:var(--emerald-bg);color:var(--emerald);border-color:#a7f3d0;}
  .p-red{background:var(--red-bg);color:var(--red);border-color:#fecaca;}
  .stnum{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-size:12px;font-family:ui-monospace,monospace;}
  .sec{display:flex;align-items:center;gap:8px;margin:24px 0 12px;}
  .sec h3{font-size:14px;font-weight:600;}
  .btn{border:0;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-dark{background:var(--ink);color:#fff;} .btn-dark:hover{background:#1e293b;}
  .btn-indigo{background:var(--indigo);color:#fff;} .btn-indigo:hover{opacity:.92;}
  .btn-ghost{background:#fff;border:1px solid #cbd5e1;color:#334155;} .btn-ghost:hover{background:#f1f5f9;}
  .btn-soft{background:var(--indigo-bg);border:1px solid #c7d2fe;color:#4338ca;}
  .btn-lg{padding:13px 22px;font-size:15px;border-radius:10px;}
  .codebox{background:#0f172a;border-radius:12px;overflow:hidden;}
  .codebox .ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #1e293b;}
  .codebox .ph span{font-size:11px;color:#94a3b8;font-family:ui-monospace,monospace;}
  .codebox .cp{font-size:11px;color:#e2e8f0;background:#334155;border:0;border-radius:6px;padding:3px 9px;cursor:pointer;}
  .codebox pre{padding:13px;color:#e2e8f0;font-family:ui-monospace,monospace;font-size:12px;line-height:1.7;white-space:pre-wrap;overflow-x:auto;}
  .muted{color:var(--muted);} .mono{font-family:ui-monospace,monospace;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead{background:#f8fafc;color:var(--muted);font-size:11px;}
  th,td{text-align:left;padding:8px 12px;}
  tbody tr{border-top:1px solid var(--line);}
  textarea,input[type=text]{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;}
  textarea:focus,input:focus{outline:2px solid #c7d2fe;border-color:#c7d2fe;}
  .frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .frame .bar{background:#f1f5f9;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;}
  .frame .bd{padding:16px;background:#fafbfc;}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .bar2{height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden;}
  .bar2 > div{height:8px;border-radius:999px;background:var(--indigo);}
  .mobtabs{display:none;}
  @media(max-width:820px){.mobtabs{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line);} .content{padding:18px;}}
  ul.disc{padding-left:18px;} ul.disc li{margin:3px 0;font-size:13px;color:#475569;}
  label.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#334155;padding:4px 0;}
  /* wizard */
  .wzbar{position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:2;}
  .wzbar .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px;}
  .wztrack{height:6px;background:#e2e8f0;border-radius:999px;overflow:hidden;}
  .wztrack > div{height:6px;background:#00857a;border-radius:999px;transition:width .25s;}
  .wzfoot{display:flex;justify-content:space-between;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);}
  .bubble{background:#fff;border:1px solid var(--line);border-radius:14px;border-top-left-radius:4px;padding:14px;font-size:13px;white-space:pre-wrap;line-height:1.7;}
  .big{font-size:18px;font-weight:600;}
  .lead{font-size:14px;color:#334155;line-height:1.7;}
  .dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;}
  .dotstep{width:9px;height:9px;border-radius:50%;background:#cbd5e1;}
  .dotstep.on{background:#00857a;} .dotstep.done{background:#0f172a;}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="mk">하나</div><div><div class="t1">하나 AI에이전트 도우미</div><div class="t2">업무 에이전트를 만들어주는 도우미</div></div></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header><div class="hh">하나증권 내부 업무용 AI 에이전트 제작 플랫폼 · 데모(mock data)</div><span class="pill-c">참고용 · 투자판단은 본인 책임</span></header>
    <div class="mobtabs" id="mobtabs"></div>
    <div class="content"><div class="inner" id="view"></div></div>
  </main>
</div>

<script>
/* ===== 데이터 ===== */
const DIVISIONS=["IB","S&T","WM","본사관리","AI디지털"];
const AGENTS=[
 {id:"buzz",name:"뉴스·종목 실시간 검색어 순위",en:"Market Buzz Ranking Agent",div:["S&T","WM","본사관리","AI디지털"],diff:"낮음",sens:"낮음",mvp:"매우 높음",
  build:"오늘 시장에서 관심이 급등한 키워드·종목 순위 화면",
  problem:"매일 아침·장중에 어떤 종목·테마·키워드가 갑자기 주목받는지 빠르게 파악해야 합니다. 뉴스·검색어·기사량·언급량으로 오늘의 관심 급등 키워드를 순위화합니다.",
  req:["뉴스 검색 데이터","종목명·키워드 언급량","주가·거래대금 데이터"],opt:["검색 트렌드 데이터","테마 매핑 데이터"],
  prompt:`너는 증권사 내부 Market Buzz 분석 에이전트야.
뉴스 검색 데이터, 종목명 언급량, 검색 트렌드, 거래대금 변화를 바탕으로
오늘 시장에서 관심도가 급등한 종목과 키워드를 순위화해줘.
출력은 다음 형식으로 작성해줘.
1. 급상승 키워드 순위  2. 관련 종목  3. 뉴스량 변화
4. 검색 관심도 변화  5. 관련 테마  6. 시장 해석
7. S&T 참고 포인트  8. WM 고객 상담용 한 줄 코멘트
투자 매수/매도 권유 표현은 사용하지 말고, 내부 업무 참고용으로 작성해줘.
출처명과 수집 시점을 함께 표시해줘.`,
  bd:{역할:"증권사 내부 Market Buzz 분석 에이전트",목적:"시장 관심도 급등 키워드·종목 순위화",입력:"뉴스 검색, 종목 언급량, 검색 트렌드, 거래대금 변화",출력:"순위·관련 종목·변화율·테마·해석·본부별 코멘트",제약:"투자 권유 금지, 출처·수집 시점 표시"},
  sec:["외부 뉴스·검색 데이터 중심이라 민감도는 낮음","고객 상담 문구가 투자 권유처럼 보이지 않게 주의","‘상승 가능성이 높다’ 같은 표현 금지","내부 업무 참고용 문구 필수"],
  exp:["S&T 장중 브리핑 알림으로 확장","WM 상담 카드 자동 생성","관심 급등 종목 푸시 알림"],
  ex:{type:"ranking",rows:[{k:"HBM",chg:"+240%",stocks:"SK하이닉스 · 한미반도체",note:"반도체 공급 기대 뉴스 집중"},{k:"로봇",chg:"+180%",stocks:"두산로보틱스 · 레인보우로보틱스",note:"정책·투자 확대 기대 관심 증가"},{k:"원전",chg:"+120%",stocks:"두산에너빌리티",note:"수주 보도 확산"}]},
  result:`오늘의 시장 관심 급등 키워드 (기준 09:30 · 출처: 뉴스 검색)
1. HBM  뉴스량 +240% · SK하이닉스, 한미반도체
   → 반도체 공급 기대 뉴스 집중. S&T: 장중 거래대금 동반 확인 권장.
2. 로봇  뉴스량 +180% · 두산로보틱스, 레인보우로보틱스
   → 정책·투자 확대 기대. WM: 관심 고객 문의 대비 코멘트 준비.
3. 원전  뉴스량 +120% · 두산에너빌리티 → 수주 보도 확산.
※ 내부 업무 참고용이며 투자 권유가 아닙니다.`},
 {id:"competitor",name:"경쟁사 이벤트·실적·서비스 동향",en:"Brokerage Competitor Radar Agent",div:["본사관리","AI디지털","WM"],diff:"보통",sens:"보통",mvp:"매우 높음",
  build:"경쟁사 이벤트·수수료·신규 서비스 동향과 자사 대응 포인트 화면",
  problem:"경쟁사의 이벤트·수수료 혜택·신규 서비스·실적·앱 업데이트를 지속 파악해야 합니다. 공개 데이터를 모아 경쟁사 동향을 요약하고 자사 대응 필요도를 판단합니다.",
  req:["증권사 공식 이벤트 페이지","뉴스 검색 데이터","공시 데이터"],opt:["앱 업데이트 정보","IR 자료","보도자료"],
  prompt:`너는 증권사 경쟁사 동향 분석 에이전트야.
경쟁 증권사의 이벤트, 수수료 혜택, 신규 서비스, 공시, 실적, 보도자료, 앱 업데이트를
바탕으로 최근 경쟁사 동향을 요약해줘.
출력: 1. 동향 요약  2. 증권사별 변화  3. 상품군 경쟁 강도
4. 공격성 점수  5. 자사 영향도  6. 고객 이탈 위험 영역
7. 추천 대응 액션  8. 경영진 보고용 한 줄 요약
출처와 수집 시점을 표시하고, 추정 내용은 반드시 '추정'이라고 표시해줘.
투자 권유나 특정 회사 비방 표현은 사용하지 말고 내부 전략 참고용으로 작성해줘.`,
  bd:{역할:"증권사 경쟁사 동향 분석 에이전트",목적:"경쟁사 변화 요약 및 자사 대응 포인트 도출",입력:"이벤트 페이지, 공시, 뉴스, 보도자료, 앱 업데이트",출력:"동향 요약·공격성 점수·경쟁 강도·대응 액션",제약:"출처·추정 표시, 비방 금지, 내부 전략 참고용"},
  sec:["공식 공개 데이터 중심으로만 수집","유료 기사 전문·로그인 필요 페이지 수집 금지","경쟁사 평가는 객관적 지표 기반","추정과 사실을 구분해 표시"],
  exp:["월간 경쟁사 리포트 자동 생성","수수료 변화 알림","마케팅 캠페인 아이디어 제안"],
  ex:{type:"competitor",rows:[{co:"키움증권",move:"수수료 무료 이벤트 강화",score:88,impact:"높음"},{co:"토스증권",move:"첫 거래 리워드 확대",score:92,impact:"신규·MZ 고객"},{co:"미래에셋증권",move:"환전 우대 집중",score:74,impact:"대응: 환전 우대 검토"}]},
  result:`경쟁사 동향 요약 (최근 7일 · 출처: 공식 이벤트 페이지·뉴스)
- 토스증권: 첫 거래 리워드 확대 (공격성 92) → 신규·MZ 고객 영향. (추정 포함)
- 키움증권: 수수료 무료 이벤트 강화 (공격성 88).
- 미래에셋: 환전 우대 집중. 자사 대응: 환전 우대/입고 이벤트 검토.
경영진 보고용 한 줄: 신규고객 유치 경쟁이 리워드 중심으로 가열.
※ 비방 없는 내부 전략 참고용.`},
 {id:"theme",name:"테마 과열도 분석",en:"Theme Heat Radar Agent",div:["S&T","WM","리서치","본사관리"],diff:"보통",sens:"낮음",mvp:"매우 높음",
  build:"오늘 과열된 테마 순위와 과열 단계 화면",
  problem:"특정 테마가 단기 급등·과열되는 경우가 많습니다. 뉴스량·관련주 수익률·거래대금·검색 관심도를 종합해 테마 과열도를 산출합니다.",
  req:["뉴스 검색 데이터","주가 데이터","거래대금 데이터","종목-테마 매핑 데이터"],opt:["검색 트렌드 데이터","수급 데이터"],
  prompt:`너는 증권사 Theme Heat Radar 에이전트야.
뉴스량 변화, 관련 종목 평균 수익률, 거래대금 변화, 검색 관심도, 테마별 종목 매핑을

출력: 1. 과열 테마 TOP 10  2. 과열 점수  3. 뉴스량 변화
4. 관련주 평균 수익률  5. 거래대금 변화  6. 주도 종목
7. 과열 판단 근거  8. S&T 모니터링 포인트  9. WM 상담 유의 문구

function apprPill(a){return pill(a,a==="승인됨"?"emerald":(a==="검토중"||a==="필요"||a==="승인대기")?"amber":(a==="반려"?"red":"slate"));}

 <div class="grid g3">${[["데이터 난이도",a.diff],["프롬프트 난이도",r.pd],["보안 민감도",a.sens],["운영 난이도",r.od],["MVP 추천도",a.mvp]].map(x=>`<div class="card pad"><div class="muted" style="font-size:12px">${x[0]}</div><div style="font-size:15px;font-weight:600;margin-top:2px">${x[1]}</div></div>`).join("")}</div>

/* ===== Prompt Doctor ===== */
function promptDoctor(){
 const d=state.diag;
 return `
 <h1>Prompt Doctor</h1><p class="sub">작성한 프롬프트를 점수화하고, 더 안전하고 구체적으로 개선하세요.</p>
 <div class="grid g2" style="margin-top:18px;align-items:start">
  <div class="card pad"><label class="muted" style="font-size:12px;font-weight:600">프롬프트를 붙여넣으세요</label>
   <textarea id="docTa" rows="12" style="margin-top:8px;font-family:ui-monospace,monospace" placeholder="예: 경쟁사 이벤트를 정리해줘.">${esc(state.docText||"")}</textarea>
   <button class="btn btn-indigo" style="width:100%;margin-top:12px" onclick="diagnose()">프롬프트 진단하기</button></div>
  <div id="diagOut">${d?diagPanel(d):`<div class="card pad" style="border-style:dashed;text-align:center;color:#94a3b8;padding:40px">왼쪽에 프롬프트를 붙여넣고<br><b style="color:#475569">‘프롬프트 진단하기’</b>를 누르세요.</div>`}</div>
 </div>`;
}
function diagnose(){const ta=document.getElementById("docTa");const t=ta?ta.value:(state.docText||"");state.docText=t;state.diag=runDiag(t);document.getElementById("diagOut").innerHTML=diagPanel(state.diag);toast("진단 완료 · "+state.diag.score+"점");}
function runDiag(t){
 t=t||"";const has=re=>re.test(t);
 const role=has(/너는|역할/),obj=has(/목적|해결|분석|요약|정리|탐지|순위/),inp=has(/데이터|뉴스|공시|주가|입력|거래대금|검색/),out=has(/출력|형식|표|순서|1\./),con=has(/금지|투자 ?권유|출처|수집 ?시점|추정|참고용/);
 const sc=v=>v?20:0;const score=sc(role)+sc(obj)+sc(inp)+sc(out)+sc(con);
 const strengths=[],improvements=[];
 if(obj)strengths.push("업무 주제가 포함되어 있습니다.");
 if(role)strengths.push("AI의 역할이 지정되어 있습니다.");
 if(inp)strengths.push("사용할 데이터가 언급되어 있습니다.");
 if(!role)improvements.push("AI의 역할이 명확하지 않습니다.");
 if(!inp)improvements.push("입력 데이터가 정의되어 있지 않습니다.");
 if(!out)improvements.push("출력 형식이 없습니다.");
 if(!has(/출처/))improvements.push("출처 표시 조건이 없습니다.");
 if(!has(/투자 ?권유|매수|매도|참고용/))improvements.push("투자권유 방지 문구가 없습니다.");
 const sourceRisk=has(/출처/)?"낮음":"높음";
 const inv=/매수|매도|추천|상승 ?가능성/.test(t)?"높음":(has(/투자 ?권유|참고용/)?"낮음":"보통");
 const priv=/개인정보|고객명|주민|계좌/.test(t)?"높음":"낮음";
 return {score:score,role:role,obj:obj,inp:inp,out:out,con:con,strengths:strengths,improvements:improvements,risk:{sourceRisk:sourceRisk,inv:inv,priv:priv},improved:improve(t)};
}
function improve(t){const first=((t||"").trim().split("\n")[0]||"").replace(/[.。]/g,"").trim();const topic=first||"경쟁사 이벤트 동향";return `너는 증권사 내부 업무를 돕는 분석 에이전트야.
${topic} 관련 내용을, 신뢰할 수 있는 공개 데이터(뉴스·공시·주가 등)를 바탕으로 정리해줘.
출력은 다음 형식으로 작성해줘.
1. 항목명  2. 핵심 내용  3. 관련 종목/대상  4. 변화·근거  5. 본부별 참고 코멘트
매수/매도 권유 표현은 쓰지 말고 내부 업무 참고용으로 작성하고,
출처와 수집 시점을 표시하고 불확실한 내용은 '추정'으로 표시해줘.`;}
function diagPanel(d){
 const lvl=v=>v?'<span style="color:var(--emerald)">충분</span>':'<span style="color:var(--red)">부족/없음</span>';
 const rp=v=>pill(v,v==="높음"?"red":v==="보통"?"amber":"emerald");
 return `
 <div class="card pad"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:13px;font-weight:600">프롬프트 품질 점수</span><span style="font-size:28px;font-weight:700;color:${d.score>=80?"var(--emerald)":d.score>=50?"var(--amber)":"var(--red)"}">${d.score}<span style="font-size:13px;color:var(--muted)">점</span></span></div><div class="bar2" style="margin-top:8px"><div style="width:${d.score}%;background:${d.score>=80?"#10b981":d.score>=50?"#f59e0b":"#ef4444"}"></div></div></div>
 <div class="card pad" style="margin-top:12px"><div style="font-size:13px;font-weight:600;margin-bottom:6px">좋은 점</div>${d.strengths.length?`<ul class="disc">${d.strengths.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<div class="muted" style="font-size:12px">아직 강점으로 잡힌 항목이 없습니다.</div>`}<div style="font-size:13px;font-weight:600;margin:10px 0 6px">개선 필요</div>${d.improvements.length?`<ul class="disc">${d.improvements.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<div class="muted" style="font-size:12px">큰 개선점이 없습니다.</div>`}</div>
 <div class="card pad" style="margin-top:12px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">위험 태그</div><div style="display:flex;gap:10px;flex-wrap:wrap;font-size:12px;align-items:center"><span>출처 누락 ${rp(d.risk.sourceRisk)}</span><span>투자권유 ${rp(d.risk.inv)}</span><span>개인정보 ${rp(d.risk.priv)}</span></div></div>
 <div class="card pad" style="margin-top:12px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">좋은 프롬프트 5요소 점검</div><div style="font-size:13px;line-height:1.9"><div>역할 · ${lvl(d.role)}</div><div>업무 목적 · ${lvl(d.obj)}</div><div>입력 데이터 · ${lvl(d.inp)}</div><div>출력 형식 · ${lvl(d.out)}</div><div>제약조건 · ${lvl(d.con)}</div></div></div>
 <div style="margin-top:12px"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:4px">자동 개선된 프롬프트</div>${codebox("개선 프롬프트",d.improved)}</div>`;
}

 <div class="card pad" style="margin-top:12px;background:#f8fafc;font-size:12px;color:#475569">총 ${PROMPTS_LIB.length}개 · 카테고리별로 골라 쓰세요. 모든 예제는 <b>투자권유가 아닌 내부 업무 참고용</b>으로 설계됐습니다. 더 많은 일반 프롬프트는 외부 모음 <a href="https://claude-prompts-kr.vercel.app" target="_blank" style="color:#4f46e5">‘300 Claude Prompts (우주보스)’</a> 도 참고하세요.</div>
 <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">${cats.map(c=>`<button class="chip ${state.plibCat===c?"on":""}" onclick="setPlibCat('${c}')">${c}</button>`).join("")}</div>
 <div class="grid g2" style="margin-top:16px">${list.map(p=>`<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:13px">${p.title}</b>${pill(p.cat,"indigo")}</div><div style="margin-top:8px">${codebox("프롬프트",p.text)}</div><div class="muted" style="font-size:11px;margin-top:6px">💡 ${p.tip}</div></div>`).join("")}</div>`;
}
function setPlibCat(c){state.plibCat=c;render();}

/* ===== 에이전트 공유 공간 ===== */
let SHARE=[
 {id:"s1",name:"아침 시황 3줄 요약",author:"S&T 박지훈",div:"S&T",desc:"매일 장 시작 전 주요 지수·이슈를 3줄로 요약해 단톡방에 공유",data:["뉴스 검색"],likes:42,uses:18,status:"공유중",tags:["요약","아침브리핑"]},
 {id:"s2",name:"공모주 일정 정리 도우미",author:"WM 김서연",div:"WM",desc:"이번 주 공모주 청약·환불·상장일과 예상 고객 문의를 정리",data:["IPO 일정","뉴스"],likes:38,uses:25,status:"공유중",tags:["공모주","상담"]},
 {id:"s3",name:"경쟁사 수수료 변화 알리미",author:"본사관리 이도윤",div:"본사관리",desc:"경쟁사 수수료·이벤트 변화를 공개 정보 기준으로 표 비교",data:["이벤트 페이지","뉴스"],likes:30,uses:12,status:"공유중",tags:["경쟁사","전략"]},
 {id:"s4",name:"종목 한 줄 코멘트 생성기",author:"WM 정민재",div:"WM",desc:"보유 종목 상담 전 참고 코멘트(참고용·매매 권유 아님)",data:["뉴스","주가"],likes:55,uses:33,status:"공유중",tags:["WM","상담"]},
 {id:"s5",name:"공시 키워드 모니터",author:"IB 최아라",div:"IB",desc:"관심 키워드 포함 공시를 모아 IB 검토 후보로 정리",data:["DART 공시"],likes:21,uses:7,status:"검토중",tags:["IB","공시"]},
 {id:"s6",name:"리포트 3줄 요약기",author:"리서치 한지우",div:"리서치",desc:"리서치 리포트를 핵심 3줄로 요약(사실 위주, 추천 표현 제거)",data:["리포트","뉴스"],likes:47,uses:29,status:"공유중",tags:["요약","리서치"]},
 {id:"s7",name:"회의록 자동 정리기",author:"AI디지털 오세훈",div:"AI디지털",desc:"회의 메모를 결정사항·할 일(담당자·기한)·논의사항으로 자동 정리",data:["내부 문서(붙여넣기)"],likes:64,uses:41,status:"공유중",tags:["문서","자동화"]},
 {id:"s8",name:"테마 과열 관찰 노트",author:"S&T 강하늘",div:"S&T",desc:"관심 테마의 뉴스량·거래대금을 모아 ‘관찰 필요’ 관점으로 정리",data:["뉴스","거래대금"],likes:26,uses:10,status:"공유중",tags:["테마","모니터링"]},
];
function shareHub(){
 state.shareDiv=state.shareDiv||"전체";
 const divs=["전체"].concat(Array.from(new Set(SHARE.map(x=>x.div))));
 let list=SHARE.slice().sort((a,b)=>b.likes-a.likes);
 if(state.shareDiv!=="전체")list=list.filter(x=>x.div===state.shareDiv);
 const top=SHARE.slice().sort((a,b)=>b.likes-a.likes).slice(0,3);
 return `
 <h1>에이전트 공유 공간</h1><p class="sub">직원들이 직접 만든 에이전트를 공유하고, 마음에 들면 가져와서 내 업무에 맞게 따라 만드는 공간입니다.</p>
 <div class="card pad" style="margin-top:12px;background:#ecfdf5;border-color:#a7f3d0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div style="font-size:13px;color:#065f46">🔥 이번 주 인기 · ${top.map(t=>t.name).join(" · ")}</div><button class="btn btn-indigo" onclick="goto('converter')">+ 내 에이전트 공유하기</button></div>
 <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">${divs.map(d=>`<button class="chip ${state.shareDiv===d?"on":""}" onclick="setShareDiv('${d}')">${d}</button>`).join("")}</div>
 <div class="muted" style="font-size:12px;margin-top:8px">인기순 정렬 · 공유 에이전트는 모두 내부 업무 참고용이며 투자 권유가 아닙니다.</div>
 <div class="grid g2" style="margin-top:14px">${list.map(x=>`
  <div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:13px">${x.name}</b>${pill(x.status,x.status==="공유중"?"emerald":"amber")}</div>
   <div class="muted" style="font-size:12px;margin-top:4px">${x.div} · ${x.author}</div>
   <div style="font-size:13px;margin-top:8px">${x.desc}</div>
   <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">${x.data.map(d=>pill(d,"indigo")).join("")}${x.tags.map(t=>pill("#"+t)).join("")}</div>
   <div class="muted" style="font-size:12px;margin-top:8px">👍 ${x.likes} · 가져간 횟수 ${x.uses}</div>
   <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-ghost" style="font-size:12px;padding:7px 10px" onclick="likeShare('${x.id}')">👍 좋아요</button><button class="btn btn-indigo" style="flex:1;font-size:12px;padding:7px 10px" onclick="importShare('${x.id}')">가져와서 따라 만들기</button></div>
  </div>`).join("")}</div>`;
}
function setShareDiv(d){state.shareDiv=d;render();}
function likeShare(id){const x=SHARE.find(s=>s.id===id);if(x){x.likes++;render();toast("좋아요! ("+x.likes+")");}}
function importShare(id){const x=SHARE.find(s=>s.id===id);if(x){x.uses++;state.idea=x.name+" — "+x.desc+" (우리 부서에 맞게 만들고 싶어요)";state.screen="converter";render();toast("내 작업공간으로 가져왔어요. 아이디어 변환기에서 이어서 만드세요.");}}

/* ===== 라우팅 ===== */
const NAV=[
 ["만들기",[["home","홈","◫"],["agents","에이전트 만들기","▦"],["share","에이전트 공유 공간","📡"]]],
 ["배우기",[["claude","Claude 시작 가이드","✦"],["prompt","좋은 프롬프트 작성법","✎"],["doctor","Prompt Doctor","🩺"],["plib","프롬프트 예제","❝"]]],
 ["내 업무로",[["converter","아이디어 → 에이전트 변환기","✳"]]],
 ["데이터/운영",[["data","데이터/API 연결 가이드","⛁"],["quality","Agent Quality Monitor","★"]]],
 ["검토",[["security","보안/준법 체크","🛡"]]],
];
let state={screen:"home",agent:null,idea:"",div:"",bp:null,step:0};
function screens(){
 switch(state.screen){
  case "home":return home();
  case "agents":return agents();
  case "wizard":return wizard();
  case "claude":return claude();
  case "prompt":return promptGuide();
  case "converter":return converter();
  case "data":return dataGuide();
  case "security":return security();
  case "doctor":return promptDoctor();
  case "quality":return qualityMonitor();
  case "plib":return promptLib();
  case "share":return shareHub();
  default:return home();
 }
}
function renderNav(){
 document.getElementById("nav").innerHTML=NAV.map(g=>`<div class="grp">${g[0]}</div>`+g[1].map(it=>{const on=(state.screen===it[0])||(state.screen==="wizard"&&it[0]==="agents");return `<button class="${on?"on":""}" onclick="goto('${it[0]}')"><span class="ic">${it[2]}</span>${it[1]}</button>`;}).join("")).join("");
 document.getElementById("mobtabs").innerHTML=NAV.flatMap(g=>g[1]).map(it=>`<button class="chip ${state.screen===it[0]?"on":""}" onclick="goto('${it[0]}')">${it[1]}</button>`).join("");
}
function render(){document.getElementById("view").innerHTML=screens();renderNav();document.querySelector(".content").scrollTop=0;}
function goto(s){state.screen=s;render();}
function startWizard(id){state.agent=id;state.bp=null;state.step=0;state.screen="wizard";render();}
function startWizardBP(){state.agent=null;state.step=0;state.screen="wizard";render();}
function customize(id){const a=AGENTS.find(x=>x.id===id);state.idea=a?`${a.name} 에이전트를 우리 부서 업무에 맞게 만들고 싶어요.`:"";state.screen="converter";render();}
function setDiv(d){state.div=state.div===d?"":d;render();}
function setIdea(t){state.idea=t;render();}
function genBP(){state.bp=buildBP(state.idea,state.div);document.getElementById("bpOut").innerHTML=blueprintPanel(state.bp);}
render();
</script>
