  /* 지표 설명 툴팁 */
  function toggleMetricTip() {
    var host = qs('#metric-tip', overlayEl);
    var btn = qs('[data-act="toggle-tip"]', overlayEl);
    if (!host || !btn) return;
    var open = btn.getAttribute('aria-expanded') === 'true';
    if (open) { closeMetricTip(); return; }

    btn.setAttribute('aria-expanded', 'true');
    host.hidden = false;
    host.className = 'tip';
    host.innerHTML =
      '<dl>' + METRICS.map(function (m) {
        return '<div><dt>' + esc(m.label) + '</dt><dd>' + esc(m.desc) + '</dd></div>';
      }).join('') + '</dl>' +
      '<button type="button" class="tip-close" data-act="close-tip">닫기</button>';
    on(qs('[data-act="close-tip"]', host), 'click', closeMetricTip);
    document.addEventListener('click', tipOutside, true);
  }
  function closeMetricTip() {
    var host = qs('#metric-tip', overlayEl);
    var btn = qs('[data-act="toggle-tip"]', overlayEl);
    if (host) { host.hidden = true; host.className = ''; host.innerHTML = ''; }
    if (btn) btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('click', tipOutside, true);
  }
  function tipOutside(e) {
    var host = qs('#metric-tip', overlayEl);
    if (!host || host.hidden) return;
    if (host.contains(e.target) || e.target.closest('[data-act="toggle-tip"]')) return;
    closeMetricTip();
  }

  /* =====================================================================
     테마별 AI 분석 바텀시트 (v1.05 슬라이드 12~14)
     ===================================================================== */
  var sheetEl = null, sheetReturnFocus = null, sheetKeyHandler = null;

  /* flow 중 세그먼트명이 언급된 문단 = 해당 스타일 대응 가이드 */
  function splitFlow(theme, seg) {
    /* v1.12: result CSV의 '유형설명'(세그먼트×테마 맞춤 해석)이 theme.advice 로 분리 제공된다.
       ③ 이렇게 대응하면 좋아요! ← theme.advice / ④ AI 정리 테마 흐름 ← theme.flow */
    var advice = arr(theme.advice).slice();
    var flow = arr(theme.flow).slice();
    if (advice.length || flow.length) return { advice: advice, rest: flow };

    /* (구버전 데이터 호환) flow 문단에서 세그먼트명 포함 문단을 맞춤 해석으로 분리 */
    if (!flow.length) return { advice: [], rest: [] };
    var name = seg && seg.name ? seg.name : '';
    var a = [], rest = [];
    flow.forEach(function (p) {
      if (name && p.indexOf(name) !== -1) a.push(p); else rest.push(p);
    });
    if (!a.length && seg && seg.typeNote) a = [seg.typeNote];
    if (!rest.length) rest = flow;
    return { advice: a, rest: rest };
  }

  function openSheet(theme, returnFocusEl) {
    if (!theme) return;
    if (overlay.kind !== 'modal') return;      /* 결과 모달 위에서만 열린다 */
    closeSheet(true);

    var s = state.seg;
    var parts = splitFlow(theme, s);
    var kws = arr(theme.keywords).slice(0, CONFIG.THEME_KEYWORDS_MAX);
    var headline = arr(theme.headlines)[0] || '';
    var issues = arr(theme.stockIssues);
    var sources = arr(theme.sources);
    /* 테마 고유 데이터가 하나도 없으면 빈 상태 (v1.05 · 원본 '보고서없음' 케이스)
       v1.12: 맞춤 해석(advice)·생성안내(notice)만 있어도 시트를 채운다 */
    var hasAny = !!(headline || theme.desc || arr(theme.flow).length ||
                    parts.advice.length || theme.notice ||
                    arr(theme.adviceSummary).length || arr(theme.flowSummary).length ||
                    issues.length || sources.length);

    sheetReturnFocus = returnFocusEl || null;

    var blocks = [];
    /* 생성 안내 — PARTIAL / NO_DATA / LOOKUP_ERROR 시 최상단 노출 (기획 · generation_message) */
    var noticeHtml = theme.notice
      ? '<div class="gen-notice">' + I.warn + '<p>' + esc(theme.notice) + '</p></div>'
      : '';
    /* 3줄 요약 박스 (기획 v2 · segment_summary_3lines / common_flow_summary_3lines)
       — 화면 상단에 먼저 노출, 정확히 3개 문장 */
    var sum3 = function (lines) {
      lines = arr(lines).slice(0, 3);
      if (!lines.length) return '';
      return '<div class="sum3"><span class="sum3-tag">3줄 요약</span><ul>' +
        lines.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') +
      '</ul></div>';
    };
    if (headline) {
      blocks.push(['지난 한 주간 테마 헤드라인',
        '<div class="hl-box"><span class="ic">' + I.mega + '</span><p>' + esc(headline) + '</p></div>']);
    }
    if (theme.desc) {
      /* ① 테마 설명 — 처음 일부 노출 후 더 보기 (기획 v2) */
      blocks.push(['테마 설명',
        collapsible([theme.desc], 'desc') +
        (kws.length ? '<div class="kw-row">' + kws.map(function (k) {
          return '<span class="kw"># ' + esc(k) + '</span>';
        }).join('') + '</div>' : '')]);
    }
    if (parts.advice.length || arr(theme.adviceSummary).length) {
      /* ③ 이렇게 대응하면 좋아요! — 3줄 요약 먼저, 상세는 더 보기 */
      blocks.push(['이렇게 대응하면 좋아요!',
        '<div class="advice">' +
          '<p class="ic-row">' + I.bulb + esc(s ? s.name : '') + ' 손님을 위한 참고 포인트</p>' +
          sum3(theme.adviceSummary) +
          (parts.advice.length ? collapsible(parts.advice, 'advice') : '') +
        '</div>']);
    }
    if (parts.rest.length || arr(theme.flowSummary).length) {
      /* ④ AI 정리 테마 흐름 — 3줄 요약 먼저, 상세는 더 보기 */
      blocks.push(['AI가 정리한 테마 흐름',
        '<div class="flow-box">' +
          sum3(theme.flowSummary) +
          (parts.rest.length ? collapsible(parts.rest, 'flow') : '') +
        '</div>']);
    }
    if (issues.length) {
      blocks.push(['지난 한 주간 발생한 주요 이슈',
        issues.map(function (g, gi) { return issueCard(g, gi); }).join('')]);
    }

    var evidence = sources.length
      ? '<details class="evidence" style="margin-top:var(--space-6)">' +
          '<summary>근거 헤드라인 보기 ' + I.chevron + '</summary>' +
          '<div class="ev-body">' + sources.map(function (g) {
            return '<div class="ev-group"><h5>' + esc(g.name) + '</h5><ul>' +
              arr(g.items).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') +
              '</ul></div>';
          }).join('') + '</div>' +
        '</details>'
      : '';

    var content = hasAny
      ? noticeHtml + blocks.map(function (b, n) {
          return '<section class="blk"><h3 class="blk-h">' +
            '<span class="n" aria-hidden="true">' + (n + 1) + '</span>' + esc(b[0]) + '</h3>' +
            b[1] + '</section>';
        }).join('') + evidence
      : '<div class="empty-blk">' + I.spark +
        '<p>이번 주에는 이 테마의 AI 분석 자료가 준비되지 않았어요.<br>' +
        '다음 분석 주기에 다시 확인해 주세요.</p></div>';

    sheetEl = document.createElement('section');
    sheetEl.className = 'sheet';
    sheetEl.setAttribute('role', 'dialog');
    sheetEl.setAttribute('aria-modal', 'true');
    sheetEl.setAttribute('aria-labelledby', 'sheet-title');
    sheetEl.innerHTML =
      '<div class="sheet-grip" data-act="grip">' +
        '<div class="bar" aria-hidden="true"></div>' +
        '<p class="tx">아래로 내려서 닫아주세요</p>' +
      '</div>' +
      '<div class="sheet-head">' +
        '<h2 id="sheet-title">' + esc(theme.name) + '</h2>' +
        '<button type="button" class="icon-btn" data-act="close-sheet" aria-label="테마 분석 닫기">' + I.close + '</button>' +
      '</div>' +
      '<div class="sheet-body">' + content +
        '<p class="sheet-foot-note">* 본 분석은 ' + esc(periodText()) +
          ' 기간의 공개 정보 및 당사 데이터를 기반으로 AI가 자동 생성한 요약이며, ' +
          '특정 종목의 매매를 권유하지 않습니다.<br>' +
          '* ' + esc(s ? s.name : '') + ' 그룹 기준 · 투자 판단의 최종 책임은 투자자 본인에게 있습니다.</p>' +
      '</div>';

    var dim = document.createElement('div');
    dim.className = 'dim';
    dim.dataset.act = 'close-sheet';
    dim.style.zIndex = '1';
    sheetEl.style.zIndex = '2';

    overlayEl.appendChild(dim);
    overlayEl.appendChild(sheetEl);
    sheetEl.__dim = dim;

    qsa('[data-act="close-sheet"]', overlayEl).forEach(function (b) {
      on(b, 'click', function () { closeSheet(); });
    });
    on(dim, 'click', function () { closeSheet(); });
    qsa('.more-btn', sheetEl).forEach(function (b) { on(b, 'click', toggleMore); });
    bindSheetDrag();

    /* 시트 전용 키 핸들러 (결과 모달 핸들러보다 우선) */
    sheetKeyHandler = function (e) {
      if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); closeSheet(); }
      else if (e.key === 'Tab') { trapFocus(sheetEl, e); }
    };
    document.addEventListener('keydown', sheetKeyHandler, true);

    var body = qs('.modal-body', overlayEl);
    if (body) body.style.overflow = 'hidden';          /* 배경 스크롤 잠금 */
    var closeBtn = qs('[data-act="close-sheet"]', sheetEl);
    if (closeBtn) closeBtn.focus();
  }

  function collapsible(paras, kind) {
    var id = 'cl-' + kind + '-' + Math.abs(hash(paras.join('|')));
    return '<div class="clamp" id="' + id + '" data-collapsed="true">' +
        paras.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
      '</div>' +
      '<button type="button" class="more-btn" data-target="' + id + '" aria-expanded="false" ' +
        'aria-controls="' + id + '">더 보기 ' + I.chevron + '</button>';
  }
  function hash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
    return h;
  }
  function toggleMore(e) {
    var btn = e.currentTarget;
    var box = qs('#' + btn.dataset.target, sheetEl);
    if (!box) return;
    var collapsed = box.dataset.collapsed === 'true';
    box.dataset.collapsed = collapsed ? 'false' : 'true';
    btn.setAttribute('aria-expanded', String(collapsed));
    btn.innerHTML = (collapsed ? '접기 ' : '더 보기 ') + I.chevron;
  }

  function issueCard(g, gi) {
    var items = arr(g.items);
    var srcs = arr(g.srcs);      // 이슈와 같은 순서의 근거 기사 제목 (기획 v1_08 · 법무검토 필수)
    var id = 'iss-' + gi;
    var li = function (raw, index) {
      var p = parseIssue(raw);
      var source = String(srcs[index] || '').trim();
      return '<li>' +
        (p.badge ? '<span class="src-badge ' + p.badge.cls + '">' + esc(p.badge.label) + '</span>' : '') +
        '<span>' + esc(p.text) +
          (source
            ? '<span class="iss-src">' + I.news + '<span class="iss-src-label">근거기사</span> ' +
                esc(source) + '</span>'
            : '') +
        '</span></li>';
    };
    var first = items.slice(0, 1).map(function (raw) { return li(raw, 0); });
    var rest = items.slice(1).map(function (raw, offset) { return li(raw, offset + 1); });
    return '<div class="issue">' +
      '<h4><span class="dot" aria-hidden="true"></span>' + esc(g.name) + '</h4>' +
      '<ul>' + first.join('') + '</ul>' +
      (rest.length
        ? '<div class="clamp" id="' + id + '" data-collapsed="true" style="margin-top:9px">' +
            '<ul>' + rest.join('') + '</ul></div>' +
          '<button type="button" class="more-btn" data-target="' + id + '" aria-expanded="false" ' +
            'aria-controls="' + id + '">이슈 ' + rest.length + '건 더 보기 ' + I.chevron + '</button>'
        : '') +
    '</div>';
  }

  /* 드래그로 닫기 — 시트 본문이 최상단일 때만 */
  function bindSheetDrag() {
    if (!sheetEl) return;
    var body = qs('.sheet-body', sheetEl);
    var startY = 0, curY = 0, dragging = false, fromGrip = false;

    function down(e) {
      if (!sheetEl) return;
      var touch = e.touches ? e.touches[0] : e;
      fromGrip = !!(e.target.closest && e.target.closest('.sheet-grip'));
      if (!fromGrip && body && body.scrollTop > 0) return;
      startY = touch.clientY; curY = startY; dragging = true;
      sheetEl.classList.add('dragging');
    }
    function move(e) {
      if (!dragging || !sheetEl) return;
      var touch = e.touches ? e.touches[0] : e;
      curY = touch.clientY;
      var dy = curY - startY;
      if (dy <= 0) { sheetEl.style.transform = ''; return; }
      if (!fromGrip && body && body.scrollTop > 0) return;
      if (e.cancelable) e.preventDefault();
      sheetEl.style.transform = 'translateY(' + dy + 'px)';
    }
    function up() {
      if (!dragging || !sheetEl) return;
      dragging = false;
      sheetEl.classList.remove('dragging');
      var dy = curY - startY;
      sheetEl.style.transform = '';
      if (dy > CONFIG.DRAG_CLOSE_PX) closeSheet();
    }

    on(sheetEl, 'touchstart', down, { passive: true });
    on(sheetEl, 'touchmove', move, { passive: false });
    on(sheetEl, 'touchend', up);
    on(sheetEl, 'touchcancel', up);
    on(qs('.sheet-grip', sheetEl), 'mousedown', function (e) { down(e); e.preventDefault(); });
    on(document, 'mousemove', move);
    on(document, 'mouseup', up);
  }

  function closeSheet(immediate) {
    if (!sheetEl) return;
    var el = sheetEl, dim = el.__dim;
    sheetEl = null;

    if (sheetKeyHandler) {
      document.removeEventListener('keydown', sheetKeyHandler, true);
      sheetKeyHandler = null;
    }
    var body = qs('.modal-body', overlayEl);
    if (body) body.style.overflow = '';

    var remove = function () {
      if (el && el.parentNode) el.parentNode.removeChild(el);
      if (dim && dim.parentNode) dim.parentNode.removeChild(dim);
      if (sheetReturnFocus && document.contains(sheetReturnFocus)) sheetReturnFocus.focus();
      sheetReturnFocus = null;
    };
    if (immediate || REDUCED) remove();
    else { el.classList.add('closing'); setTimeout(remove, CONFIG.SHEET_CLOSE_MS); }
  }

  function closeOverlay(immediate) {
    closeSheet(true);
    closeMetricTip();
    if (overlay.kind) {
      overlayEl.hidden = true;
      overlayEl.innerHTML = '';
      overlay.kind = null;
      unbindOverlayKeys();
      if (!immediate && overlay.lastFocus && document.contains(overlay.lastFocus)) {
        overlay.lastFocus.focus();
      }
      overlay.lastFocus = null;
    }
  }

  /* =====================================================================
     결과 파일 공유 (v1.11 · HTML 저장/미리보기 선택창)
     현재 문서를 복제 → 공유 설정에 투자 스타일 코드만 기록 → 단일 HTML 파일 생성
     ===================================================================== */

  function getCurrentSegmentCode() {
    return state.seg && state.seg.flat ? state.seg.flat : null;
  }
  function isValidSegmentCode(code) {
    var c = String(code == null ? '' : code).replace(/-/g, '').toUpperCase();
    return c.length === 4 && !!SEG_BY_FLAT[c];
  }
  function getEmbeddedShareConfig() {
    try {
      var el = document.getElementById(CONFIG.SHARE_CONFIG_ID);
      if (!el) return null;
      var cfg = JSON.parse(el.textContent || '{}');
      return (cfg && typeof cfg === 'object') ? cfg : null;
    } catch (e) {
      if (window.console) console.warn('[aiStyle] 공유 설정 파싱 실패 — 공유 모드 비활성화', e);
      return null;
    }
  }
  function getHashShareCode() {
    var m = String(location.hash || '').match(/share=([A-Za-z]{4}|[A-Za-z](?:-[A-Za-z]){3})/);
    return m ? m[1] : null;
  }
  function shareFileName(code) {
    return CONFIG.SHARE_FILE_PREFIX + String(code).replace(/[^A-Za-z0-9]/g, '') + '.html';
  }

  /* 1) 문서 복제 + 공유 코드 기록 */
  function createShareDocumentClone(code) {
    var clone = document.documentElement.cloneNode(true);
    var cfg = clone.querySelector('#' + CONFIG.SHARE_CONFIG_ID);
    if (!cfg) throw new Error('공유 설정 스크립트를 찾지 못했습니다');
    cfg.textContent = JSON.stringify({ version: 1, code: code });
    return clone;
  }

  /* 2) 실행 중 생긴 DOM·상태 제거 → 초기 진입 가능한 깨끗한 문서로 */
  function sanitizeShareDocument(clone) {
    var reset = function (sel, hide) {
      var el = clone.querySelector(sel);
      if (!el) return;
      el.innerHTML = '';
      el.removeAttribute('style');
      if (hide) el.setAttribute('hidden', ''); else el.removeAttribute('hidden');
    };
    reset('#page', false);      // 앱 컨테이너 비우기
    reset('#overlay', true);    // 결과 모달
    reset('#popup', true);      // 확인 팝업
    reset('#toast', true);      // 토스트

    /* 실행 중에만 생기는 노드 제거 */
    ['.sheet', '.dim', '.modal', '.popup', '.tip'].forEach(function (sel) {
      Array.prototype.forEach.call(clone.querySelectorAll(sel), function (el) {
        if (el.parentNode) el.parentNode.removeChild(el);
      });
    });

    /* 앱이 심은 스크립트(data-aistyle)만 남기고 나머지는 제거한다.
       확장 프로그램·검사도구 등이 주입한 스크립트가 공유 파일에 섞이지 않도록. */
    Array.prototype.forEach.call(clone.querySelectorAll('script'), function (el) {
      if (!el.hasAttribute('data-aistyle') && el.parentNode) el.parentNode.removeChild(el);
    });

    /* html / body 의 임시 클래스·인라인 스타일 제거 */
    clone.removeAttribute('class');
    clone.removeAttribute('style');
    var body = clone.querySelector('body');
    if (body) { body.removeAttribute('class'); body.removeAttribute('style'); }

    /* 입력·선택 상태 제거 */
    Array.prototype.forEach.call(clone.querySelectorAll('input, textarea, select'), function (el) {
      el.removeAttribute('value'); el.removeAttribute('checked'); el.removeAttribute('selected');
      if ('value' in el) el.value = '';
    });
    Array.prototype.forEach.call(clone.querySelectorAll('[aria-pressed], [aria-expanded], [aria-busy]'),
      function (el) {
        el.removeAttribute('aria-pressed'); el.removeAttribute('aria-expanded');
        el.removeAttribute('aria-busy');
      });
    return clone;
  }

  /* 3) 완전한 HTML 문자열로 직렬화 */
  function serializeShareDocument(clone) {
    return '<!doctype html>\n' + clone.outerHTML + '\n';
  }

  /* 4-a) 문서(DOM) 단위 검증 — 스크립트·스타일 텍스트를 오탐하지 않는다.
          (문자열 검사만 하면 app.js 의 정규식 리터럴이나 CSS 선택자
           `[aria-pressed="true"]` 를 실제 상태로 오인한다) */
  function validateShareDocument(clone, code) {
    var problems = [];
    if (!clone) return ['복제 문서 없음'];

    var cfgEl = clone.querySelector('#' + CONFIG.SHARE_CONFIG_ID);
    if (!cfgEl) problems.push('공유 설정 스크립트 없음');
    else {
      try {
        var cfg = JSON.parse(cfgEl.textContent || '{}');
        var keys = Object.keys(cfg).sort().join(',');
        if (keys !== 'code,version') problems.push('공유 설정에 허용되지 않은 키: ' + keys);
        if (cfg.code !== code) problems.push('공유 설정 코드 불일치');
      } catch (e) { problems.push('공유 설정 JSON 파싱 실패'); }
    }

    /* 앱이 심은 스크립트(config·data·app) 3개만 남아 있어야 한다 */
    var scripts = clone.querySelectorAll('script');
    var marks = [];
    Array.prototype.forEach.call(scripts, function (el) {
      marks.push(el.getAttribute('data-aistyle') || '(표식없음)');
    });
    marks.sort();
    if (marks.join(',') !== 'app,boot,config,data') {
      problems.push('스크립트 구성 이상: [' + marks.join(', ') + ']');
    }

    /* 실행 중 상태 DOM 이 남아 있지 않은가 */
    [
      ['[aria-pressed]', '설문 선택 상태 포함'],
      ['.screen', '실행 중 화면 DOM 포함'],
      ['.modal', '결과 모달 DOM 포함'],
      ['.sheet', '바텀시트 DOM 포함'],
      ['.metric', '개인 거래 지표 DOM 포함'],
      ['.theme-card', '보유 테마 DOM 포함'],
      ['.preview', '관심종목 미리보기 DOM 포함'],
      ['.popup', '팝업 DOM 포함']
    ].forEach(function (p) {
      if (clone.querySelector(p[0])) problems.push(p[1]);
    });

    var page = clone.querySelector('#page');
    if (page && page.innerHTML.trim() !== '') problems.push('앱 컨테이너가 비어 있지 않음');
    return problems;
  }

  /* 4-b) 직렬화된 HTML 문자열 검증 (개인정보 패턴 · 필수 구성요소 · 크기) */
  function validateSharedHtml(html, code) {
    var problems = [];
    if (!html || typeof html !== 'string') return { ok: false, problems: ['HTML 생성 실패'] };

    /* 공유 설정 — id 로 특정하므로 오탐 없음 */
    var m = html.match(/id=["']shared-result-config["'][^>]*>([\s\S]*?)<\/script>/i);
    if (!m) problems.push('공유 설정 스크립트 없음');
    else {
      try {
        var cfg = JSON.parse(m[1]);
        var keys = Object.keys(cfg).sort().join(',');
        if (keys !== 'code,version') problems.push('공유 설정에 허용되지 않은 키: ' + keys);
        if (cfg.code !== code) problems.push('공유 설정 코드 불일치');
      } catch (e) { problems.push('공유 설정 JSON 파싱 실패'); }
    }

    /* 사용자 상태가 직렬화되어 들어가지 않았는가 (JSON 형태만 탐지) */
    [
      [/"answers"\s*:\s*\[/, '설문 응답 배열 포함'],
      [/"qi"\s*:\s*\d/, '설문 진행 위치 포함'],
      [/"segCode"\s*:/, '저장 상태 직렬화 포함'],
      [/"started"\s*:\s*(true|false)/, '설문 진행 여부 직렬화 포함']
    ].forEach(function (p) { if (p[0].test(html)) problems.push(p[1]); });

    /* 단독 실행에 필요한 구성요소가 모두 들어갔는가 */
    if (html.indexOf('window.APP_DATA') === -1) problems.push('APP_DATA 누락');
    if (html.indexOf('__aiStyle') === -1) problems.push('앱 로직 누락');
    if ((html.match(/@font-face/g) || []).length < 3) problems.push('임베디드 폰트 누락');
    if (html.indexOf('data:font/woff;base64') === -1) problems.push('폰트 데이터 누락');
    if (html.indexOf('<!doctype html>') !== 0) problems.push('doctype 누락');

    /* 크기가 원본과 크게 다르지 않은가 */
    var liveLen = document.documentElement.outerHTML.length;
    if (liveLen > 0) {
      var diff = Math.abs(html.length - liveLen) / liveLen;
      if (diff > CONFIG.SHARE_SIZE_TOLERANCE) {
        problems.push('문서 크기 편차 ' + Math.round(diff * 100) + '%');
      }
    }
    return { ok: problems.length === 0, problems: problems };
  }

  /* 5) 파일 생성 */
  function createSharedHtmlFile(code) {
    var clone = sanitizeShareDocument(createShareDocumentClone(code));

    var docProblems = validateShareDocument(clone, code);
    var html = serializeShareDocument(clone);
    var check = validateSharedHtml(html, code);
    var problems = docProblems.concat(check.problems);
    if (problems.length) {
      if (window.console) console.warn('[aiStyle] 공유 파일 검증 실패', problems);
      return { ok: false, reason: 'unsafe', problems: problems };
    }
    var name = shareFileName(code);
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var file = null;
    try { file = new File([blob], name, { type: 'text/html' }); } catch (e) { file = null; }
    return { ok: true, html: html, blob: blob, file: file, name: name, size: blob.size };
  }

  function downloadResultFile(blob, name) {
    if (!blob || !blob.size) throw new Error('저장할 파일 데이터가 없습니다');

    /* 구형 Windows 계열 브라우저 대체 */
    if (navigator.msSaveOrOpenBlob) {
      navigator.msSaveOrOpenBlob(blob, name);
      return true;
    }

    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    a.style.position = 'fixed';
    a.style.left = '-9999px';
    a.style.top = '0';
    document.body.appendChild(a);

    try {
      /* 실제 사용자 클릭에서 호출되므로 Chrome/Edge/Firefox의 file:// 환경에서도 동작한다. */
      a.click();
    } finally {
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 12000);
    }
    return true;
  }

  /* 6) 버튼 핸들러 — v1.11
     첫 클릭에서 자동 다운로드를 시도하지 않고, 반드시 눈에 보이는 선택창을 연다.
     선택창 안의 버튼은 새로운 사용자 활성화(user activation)를 제공하므로
     file://, 모바일 WebView, 다운로드 차단 환경에서 성공률이 더 높다. */
  var sharing = false;
  var activeSharePackage = null;

  function releaseActiveSharePackage() {
    if (activeSharePackage && activeSharePackage.previewUrl) {
      try { URL.revokeObjectURL(activeSharePackage.previewUrl); } catch (e) {}
    }
    activeSharePackage = null;
  }

  function formatFileSize(bytes) {
    var n = Number(bytes) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function setShareStatus(text) {
    var el = qs('#share-status', overlayEl);
    if (el) el.textContent = text || '';
  }
  function setShareBusy(busy) {
    var btn = qs('[data-act="share-result"]', overlayEl);
    var label = qs('[data-share-label]', overlayEl);
    if (btn) { btn.disabled = !!busy; btn.setAttribute('aria-busy', busy ? 'true' : 'false'); }
    if (label) label.textContent = busy ? MSG.building : '결과 파일 공유하기';
  }

  function setSharePopupStatus(text, isError) {
    if (!popupHost) return;
    var el = qs('[data-share-popup-status]', popupHost);
    if (!el) return;
    el.textContent = text || '';
    el.style.color = isError ? 'var(--color-danger)' : 'var(--color-primary)';
  }

  function setSharePopupButtonsBusy(busy) {
    qsa('[data-share-action]', popupHost).forEach(function (btn) {
      btn.disabled = !!busy;
      btn.setAttribute('aria-busy', busy ? 'true' : 'false');
    });
  }

  function openSharedFilePreview(made) {
    if (!made || !made.blob) throw new Error('미리보기 파일이 없습니다');
    if (!made.previewUrl) made.previewUrl = URL.createObjectURL(made.blob);

    var win = null;
    try { win = window.open(made.previewUrl, '_blank', 'noopener'); } catch (e) { win = null; }
    if (!win) {
      var a = document.createElement('a');
      a.href = made.previewUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, 1000);
    }
    return true;
  }

  function showSharePopup(made) {
    if (!popupHost || !made || !made.ok) return;
    closePopup();
    activeSharePackage = made;

    var titleId = 'share-popup-title';
    popupHost.hidden = false;
    popupHost.innerHTML =
      '<div class="dim" data-popup-dismiss></div>' +
      '<div class="popup share-popup" role="dialog" aria-modal="true" aria-labelledby="' + titleId + '">' +
        '<button type="button" class="share-close" data-share-action="close" aria-label="공유 창 닫기">' + I.close + '</button>' +
        '<div class="share-popup-head">' +
          '<span class="share-popup-icon" aria-hidden="true">' + I.share + '</span>' +
          '<div><h3 id="' + titleId + '">공유 파일이 준비됐어요</h3></div>' +
        '</div>' +
        '<p class="share-popup-desc">카카오톡으로 바로 공유하거나 HTML 파일로 저장할 수 있어요. ' +
          '받은 사람은 결과를 확인한 뒤 <b>나도 해보기</b>를 진행할 수 있어요.</p>' +
        '<div class="share-file-card">' +
          '<span class="file-ic" aria-hidden="true">' + I.share + '</span>' +
          '<span class="file-info"><span class="file-name">' + esc(made.name) + '</span>' +
          '<span class="file-size">단일 HTML · ' + esc(formatFileSize(made.size)) + '</span></span>' +
        '</div>' +
        '<div class="share-popup-actions">' +
          '<button type="button" class="btn btn-kakao" data-share-action="kakao">' +
            I.kakao + '카카오톡으로 공유</button>' +
          '<button type="button" class="btn btn-primary" data-share-action="save">' +
            I.share + 'HTML 파일 저장</button>' +
          '<div class="share-popup-secondary">' +
            '<button type="button" class="btn btn-ghost" data-share-action="preview">결과 미리보기</button>' +
            '<button type="button" class="btn btn-ghost" data-share-action="image">' +
              '결과 이미지 저장</button>' +
          '</div>' +
        '</div>' +
        '<p class="share-popup-status" data-share-popup-status role="status" aria-live="polite">' +
          '카카오톡 공유 또는 HTML 파일 저장을 선택해 주세요.</p>' +
        '<p class="share-popup-note">설문 응답이나 개인 거래정보는 포함되지 않고 투자 스타일 코드만 저장됩니다.</p>' +
      '</div>';

    on(qs('[data-share-action="kakao"]', popupHost), 'click', function () {
      if (!activeSharePackage) return;
      setSharePopupButtonsBusy(true);
      shareToKakao(activeSharePackage, function (ok, msg) {
        setSharePopupButtonsBusy(false);
        setSharePopupStatus(msg, !ok);
        setShareStatus(msg);
        if (ok) toast(msg);
      });
    });

    on(qs('[data-share-action="save"]', popupHost), 'click', function () {
      if (!activeSharePackage) return;
      setSharePopupButtonsBusy(true);
      try {
        downloadResultFile(activeSharePackage.blob, activeSharePackage.name);
        setSharePopupStatus(MSG.downloaded, false);
        setShareStatus(MSG.downloaded);
        toast('공유용 HTML 파일 저장을 시작했어요.');
      } catch (e) {
        if (window.console) console.warn('[aiStyle] 공유 파일 저장 실패', e);
        setSharePopupStatus('파일 저장이 차단됐어요. 결과 미리보기를 열어 브라우저 메뉴에서 저장해 주세요.', true);
      }
      setTimeout(function () { setSharePopupButtonsBusy(false); }, 450);
    });

    on(qs('[data-share-action="image"]', popupHost), 'click', function () {
      setSharePopupButtonsBusy(true);
      setSharePopupStatus('결과 이미지를 만드는 중...', false);
      /* 캔버스 렌더가 UI를 잠깐 막으므로 한 프레임 양보 */
      setTimeout(function () {
        try {
          saveResultImage(state.seg || defaultSeg(), function (ok, msg) {
            setSharePopupButtonsBusy(false);
            setSharePopupStatus(msg, !ok);
            setShareStatus(msg);
            if (ok) toast(msg);
          });
        } catch (e) {
          if (window.console) console.warn('[aiStyle] 결과 이미지 생성 실패', e);
          setSharePopupButtonsBusy(false);
          setSharePopupStatus('이미지를 만들지 못했어요. 잠시 후 다시 시도해 주세요.', true);
        }
      }, 30);
    });

    on(qs('[data-share-action="preview"]', popupHost), 'click', function () {
      if (!activeSharePackage) return;
      try {
        openSharedFilePreview(activeSharePackage);
        setSharePopupStatus('새 탭에서 공유 결과 미리보기를 열었어요.', false);
      } catch (e) {
        if (window.console) console.warn('[aiStyle] 공유 결과 미리보기 실패', e);
        setSharePopupStatus('미리보기를 열지 못했어요. HTML 파일 저장을 이용해 주세요.', true);
      }
    });

    on(qs('[data-share-action="close"]', popupHost), 'click', closePopup);
    on(qs('[data-popup-dismiss]', popupHost), 'click', closePopup);

    popupKeyHandler = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); closePopup(); }
      else if (e.key === 'Tab') { trapFocus(popupHost, e); }
    };
    document.addEventListener('keydown', popupKeyHandler);
    var first = qs('[data-share-action="save"]', popupHost);
    if (first) first.focus();
  }

  /* ---------------------------------------------------- 카카오톡 공유 (v1.12)
     경로 1) KAKAO_JS_KEY 가 설정된 실서비스: 카카오 JS SDK 피드 공유
     경로 2) 모바일 브라우저: Web Share API 로 결과 HTML 파일 공유 → 공유 시트에서 카카오톡 선택
     경로 3) 텍스트만 공유 가능한 환경: 결과 요약 텍스트 공유
     경로 4) 모두 불가(PC file:// 등): 파일 저장 후 카카오톡 첨부 안내 */
  var kakaoSdkState = 0;   // 0 미시도 · 1 로딩중 · 2 성공 · -1 실패
  var kakaoSdkWaiters = [];

  function loadKakaoSdk(cb) {
    if (window.Kakao) { kakaoSdkState = 2; cb(true); return; }
    if (kakaoSdkState === 2) { cb(true); return; }
    if (kakaoSdkState === -1) { cb(false); return; }
    kakaoSdkWaiters.push(cb);
    if (kakaoSdkState === 1) return;
    kakaoSdkState = 1;
    var sc = document.createElement('script');
    sc.src = CONFIG.KAKAO_SDK_URL;
    sc.async = true;
    /* data-aistyle 표식이 없으므로 공유 파일 생성 시 자동 제거된다 */
    var done = function (ok) {
      kakaoSdkState = ok ? 2 : -1;
      var ws = kakaoSdkWaiters.slice(); kakaoSdkWaiters = [];
      ws.forEach(function (fn) { fn(ok); });
    };
    sc.onload = function () { done(!!window.Kakao); };
    sc.onerror = function () { done(false); };
    document.head.appendChild(sc);
  }

  function kakaoShareText() {
    var s = state.seg;
    var name = s && s.name ? s.name : '나의 투자스타일';
    return '[하나증권 AI 맛보기] 나의 투자스타일은 "' + name + '"! ' +
      '1분 설문으로 내 투자스타일과 AI 투자정보를 확인해 보세요.';
  }

  function shareToKakao(made, cb) {
    cb = cb || function () {};
    var pageUrl = CONFIG.SHARE_PAGE_URL ||
      (/^https?:/i.test(location.protocol) ? location.href.split('#')[0] : '');

    /* 경로 1 — 카카오 SDK (실서비스: JS 키·도메인 등록 필요) */
    if (CONFIG.KAKAO_JS_KEY && pageUrl) {
      loadKakaoSdk(function (ok) {
        if (!ok || !window.Kakao || !window.Kakao.Share) { shareViaSheet(made, cb); return; }
        try {
          if (!window.Kakao.isInitialized()) window.Kakao.init(CONFIG.KAKAO_JS_KEY);
          var code = getCurrentSegmentCode() || '';
          var url = pageUrl + (pageUrl.indexOf('?') === -1 ? '?' : '&') + 'seg=' + encodeURIComponent(code);
          window.Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
              title: '1분만에 알아보는 나의 투자스타일',
              description: kakaoShareText(),
              imageUrl: CONFIG.KAKAO_SHARE_IMAGE_URL || pageUrl,
              link: { mobileWebUrl: url, webUrl: url }
            },
            buttons: [{ title: '내 결과 보기', link: { mobileWebUrl: url, webUrl: url } },
                      { title: '나도 해보기', link: { mobileWebUrl: pageUrl, webUrl: pageUrl } }]
          });
          cb(true, MSG.kakaoOk);
        } catch (e) {
          if (window.console) console.warn('[aiStyle] 카카오 SDK 공유 실패', e);
          shareViaSheet(made, cb);
        }
      });
      return;
    }
    shareViaSheet(made, cb);
  }

  function shareViaSheet(made, cb) {
    var text = kakaoShareText();
    /* 경로 2 — 파일 공유 (모바일 공유 시트 → 카카오톡 선택) */
    if (made && made.file && navigator.share && navigator.canShare &&
        navigator.canShare({ files: [made.file] })) {
      navigator.share({ files: [made.file], title: '나의 투자스타일', text: text })
        .then(function () { cb(true, MSG.kakaoSheet); })
        .catch(function (e) {
          if (e && e.name === 'AbortError') { cb(true, '공유를 취소했어요.'); return; }
          shareTextOnly(text, cb);
        });
      return;
    }
    shareTextOnly(text, cb);
  }

  function shareTextOnly(text, cb) {
    /* 경로 3 — 텍스트 공유 */
    if (navigator.share) {
      navigator.share({ title: '나의 투자스타일', text: text })
        .then(function () { cb(true, MSG.kakaoSheet); })
        .catch(function (e) {
          if (e && e.name === 'AbortError') { cb(true, '공유를 취소했어요.'); return; }
          cb(false, MSG.kakaoFail);
        });
      return;
    }
    /* 경로 4 — PC 등: 안내 */
    cb(false, MSG.kakaoFail);
  }

  /* ---------------------------------------------- 결과 이미지 저장 (v1.17)
     결과 요약(유형 카드 · 4가지 기준 축 · 강점/유의점)을 캔버스에 직접 그려 PNG로 저장.
     외부 라이브러리 없이 동작하며 파일은 나의투자스타일_{코드}.png 로 내려간다. */
  var IMG = {
    W: 720, PAD: 44, SCALE: 2,
    bg1: '#F1F9F6', bg2: '#FFFFFF',
    ink: '#111417', body: '#2E3338', subtle: '#5C646C', muted: '#868E96',
    primary: '#00755F', accent: '#00A57F', border: '#E7EAED',
    mint: '#EDF7F3', mintLine: '#BFE2D4',
    good: '#EDF7F3', warnBg: '#FFF8EC', warnLine: '#FBE3B8', warnInk: '#8A5A0B'
  };

  function imgFont(px, w) {
    return (w || 400) + ' ' + px + 'px ' + "'AIStyleSans','Pretendard','Malgun Gothic',sans-serif";
  }

  /* 줄바꿈: 최대 폭에 맞춰 문자 단위로 자른다 (한국어) */
  function wrapText(ctx, text, maxW) {
    var out = [], line = '';
    String(text || '').split('').forEach(function (ch) {
      var t = line + ch;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch === ' ' ? '' : ch; }
      else line = t;
    });
    if (line) out.push(line);
    return out;
  }

  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawResultImage(s) {
    var W = IMG.W, P = IMG.PAD, SC = IMG.SCALE;
    var flat = String(s.flat || '').split('');
    /* 높이 선계산용 임시 캔버스 */
    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d');

    var innerW = W - P * 2;
    var strengths = arr(s.strengths), cautions = arr(s.cautions);

    /* --- 본문 줄 수 측정 --- */
    ctx.font = imgFont(20);
    var defLines = wrapText(ctx, s.definition, innerW - 72);
    var listW = innerW - 64 - 40;
    ctx.font = imgFont(19);
    var goodLines = [], warnLines = [];
    strengths.forEach(function (t) { goodLines.push(wrapText(ctx, t, listW)); });
    cautions.forEach(function (t) { warnLines.push(wrapText(ctx, t, listW)); });
    var lh = 30;
    var goodH = 76 + goodLines.reduce(function (a, l) { return a + l.length * lh + 10; }, 0) + 14;
    var warnH = 76 + warnLines.reduce(function (a, l) { return a + l.length * lh + 10; }, 0) + 14;

    var typeCardH = 118 + 46 + defLines.length * 31 + 40 + 96 + 40;
    var axesH = 54 + 176;
    var H = 88 + typeCardH + 40 + axesH + 56 + goodH + 18 + warnH + 96;

    cv.width = W * SC; cv.height = H * SC;
    ctx = cv.getContext('2d');
    ctx.scale(SC, SC);
    ctx.textBaseline = 'alphabetic';

    /* --- 배경 --- */
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, IMG.bg1); g.addColorStop(1, '#DCF0EA');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var y = 64;
    /* --- 헤더 --- */
    ctx.fillStyle = IMG.primary; ctx.font = imgFont(19, 800); ctx.textAlign = 'center';
    ctx.fillText('하나증권 AI 서비스 맛보기 · 나의 투자 스타일', W / 2, y);
    y += 24;

    /* --- 유형 카드 --- */
    var cardY = y;
    rr(ctx, P - 12, cardY, innerW + 24, typeCardH, 22);
    ctx.fillStyle = IMG.bg2; ctx.fill();
    ctx.strokeStyle = IMG.mintLine; ctx.lineWidth = 1.5; ctx.stroke();

    /* 코드 칩 SHDG */
    var chip = 56, gap = 12, cw = flat.length * chip + (flat.length - 1) * gap;
    var cx = (W - cw) / 2;
    flat.forEach(function (c) {
      rr(ctx, cx, cardY + 34, chip, chip, 14);
      ctx.fillStyle = IMG.mint; ctx.fill();
      ctx.strokeStyle = IMG.mintLine; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = IMG.primary; ctx.font = imgFont(27, 800); ctx.textAlign = 'center';
      ctx.fillText(c, cx + chip / 2, cardY + 34 + chip / 2 + 10);
      cx += chip + gap;
    });
    var ty = cardY + 34 + chip + 52;
    ctx.fillStyle = IMG.primary; ctx.font = imgFont(34, 800); ctx.textAlign = 'center';
    ctx.fillText(s.name, W / 2, ty);
    ty += 40;
    ctx.fillStyle = IMG.ink; ctx.font = imgFont(20, 600);
    defLines.forEach(function (l) { ctx.fillText(l, W / 2, ty); ty += 31; });
    ty += 6;
    ctx.fillStyle = IMG.subtle; ctx.font = imgFont(17);
    ctx.fillText(s.tagline, W / 2, ty);
    ty += 34;

    /* 통계 2칸 */
    var sw = (innerW - 14) / 2, sx = P;
    var stats = [
      ['하나증권 손님 중', s.share + '%'],
      [D.segments.length + '개 스타일 그룹 중 수익률', s.returnRank + '위']
    ];
    stats.forEach(function (st) {
      rr(ctx, sx, ty, sw, 84, 14);
      ctx.fillStyle = IMG.bg2; ctx.fill();
      ctx.strokeStyle = IMG.border; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = IMG.muted; ctx.font = imgFont(14.5, 600); ctx.textAlign = 'center';
      ctx.fillText(st[0], sx + sw / 2, ty + 32);
      ctx.fillStyle = IMG.primary; ctx.font = imgFont(24, 800);
      ctx.fillText(st[1], sx + sw / 2, ty + 66);
      sx += sw + 14;
    });
    y = cardY + typeCardH + 40;

    /* --- 4가지 기준 축 --- */
    ctx.fillStyle = IMG.ink; ctx.font = imgFont(22, 800); ctx.textAlign = 'left';
    ctx.fillText('4가지 기준 축', P - 12, y + 8);
    y += 40;
    var aw = (innerW + 24 - 3 * 12) / 4, ax = P - 12;
    D.axes.forEach(function (axis, ai) {
      rr(ctx, ax, y, aw, 176, 16);
      ctx.fillStyle = IMG.bg2; ctx.fill();
      ctx.strokeStyle = IMG.border; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = IMG.body; ctx.font = imgFont(15.5, 800); ctx.textAlign = 'center';
      ctx.fillText(axis.name, ax + aw / 2, y + 30);
      var py = y + 44;
      arr(axis.poles).forEach(function (p) {
        var mine = flat[ai] === p.code;
        rr(ctx, ax + 8, py, aw - 16, 58, 11);
        ctx.fillStyle = mine ? IMG.mint : '#F7F8F9'; ctx.fill();
        if (mine) { ctx.strokeStyle = IMG.accent; ctx.lineWidth = 1.6; ctx.stroke(); }
        ctx.fillStyle = mine ? IMG.primary : IMG.muted;
        ctx.font = imgFont(16, mine ? 800 : 700);
        ctx.fillText(p.code + ' ' + p.label, ax + aw / 2, py + 25);
        ctx.font = imgFont(11.5, mine ? 700 : 500);
        ctx.fillText(mine ? '내 성향' : (p.sub || ''), ax + aw / 2, py + 45);
        py += 64;
      });
      ax += aw + 12;
    });
    y += 176 + 56;

    /* --- 강점 / 유의점 --- */
    function listCard(title, groups, bg, line, inkColor, dot) {
      var h = 76 + groups.reduce(function (a, l) { return a + l.length * lh + 10; }, 0) + 14;
      rr(ctx, P - 12, y, innerW + 24, h, 18);
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = line; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = inkColor; ctx.font = imgFont(19.5, 800); ctx.textAlign = 'left';
      ctx.fillText(title, P + 20, y + 44);
      var ly = y + 82;
      ctx.font = imgFont(19);
      groups.forEach(function (lines) {
        ctx.fillStyle = dot;
        ctx.beginPath(); ctx.arc(P + 26, ly - 7, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = IMG.body;
        lines.forEach(function (l) { ctx.fillText(l, P + 44, ly); ly += lh; });
        ly += 10;
      });
      y += h + 18;
    }
    listCard('이 스타일의 강점', goodLines, IMG.good, IMG.mintLine, IMG.primary, IMG.accent);
    listCard('유의점', warnLines, IMG.warnBg, IMG.warnLine, IMG.warnInk, '#DFAE52');

    /* --- 푸터 --- */
    ctx.fillStyle = IMG.muted; ctx.font = imgFont(14); ctx.textAlign = 'center';
    ctx.fillText('1분 설문으로 알아보는 나의 투자스타일 · ' + periodText() + ' 기준', W / 2, y + 26);
    return cv;
  }

  function saveResultImage(s, cb) {
    cb = cb || function () {};
    if (!s) { cb(false, '저장할 결과가 없어요.'); return; }
    var name = CONFIG.SHARE_FILE_PREFIX + s.flat + '.png';
    var finish = function (blob) {
      if (!blob) { cb(false, '이미지를 만들지 못했어요. 잠시 후 다시 시도해 주세요.'); return; }
      try {
        downloadResultFile(blob, name);
        cb(true, '결과 이미지를 저장했어요. 갤러리/다운로드 폴더를 확인해 주세요.');
      } catch (e) {
        cb(false, '이미지 저장이 차단됐어요. 다시 시도해 주세요.');
      }
    };
    var run = function () {
      var cv = drawResultImage(s);
      if (cv.toBlob) cv.toBlob(finish, 'image/png');
      else {
        try {
          var bin = atob(cv.toDataURL('image/png').split(',')[1]);
          var buf = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
          finish(new Blob([buf], { type: 'image/png' }));
        } catch (e) { finish(null); }
      }
    };
    /* 임베디드 폰트가 캔버스에 적용되도록 로드 완료를 기다린다 (최대 400ms) */
    var ran = false;
    var once = function () { if (!ran) { ran = true; run(); } };
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(once, once);
      setTimeout(once, 400);
    } else once();
  }

  function handleResultShare() {
    /* 첫 클릭은 파일 생성 후 명시적 선택창을 연다. 아무 반응 없이 끝나지 않는다. */
    if (sharing) return;
    var code = getCurrentSegmentCode();
    if (!isValidSegmentCode(code)) { toast(MSG.noCode); setShareStatus(MSG.noCode); return; }

    sharing = true;
    setShareBusy(true);
    setShareStatus(MSG.building);

    /* 큰 단일 HTML 복제 중에도 버튼 눌림 상태가 먼저 그려지도록 한 프레임 양보 */
    var run = function () {
      var made;
      try {
        made = createSharedHtmlFile(code);
      } catch (e) {
        if (window.console) console.warn('[aiStyle] 공유 파일 생성 예외', e);
        made = { ok: false, reason: 'build' };
      }

      sharing = false;
      setShareBusy(false);

      if (!made || !made.ok) {
        var msg = made && made.reason === 'unsafe' ? MSG.unsafe : MSG.buildFail;
        setShareStatus(msg); toast(msg);
        return;
      }
      if (!made.size) { setShareStatus(MSG.buildFail); toast(MSG.buildFail); return; }

      setShareStatus(MSG.ready);
      showSharePopup(made);
    };

    /* 글로벌 클릭 잠금과 무관하게 항상 실행한다. */
    setTimeout(run, 20);
  }

  /* =====================================================================
     공유 전용 결과 화면
     ===================================================================== */
  PAGES.shared = function () {
    var s = state.seg;
    if (!s) { go('intro'); return; }
    renderSharedResult(s.flat);
  };

  function renderSharedResult(code) {
    var s = segByCode(code);
    if (!s) {
      if (window.console) console.warn('[aiStyle] 공유 코드가 유효하지 않아 인트로로 이동:', code);
      state.sharedMode = false;
      go('intro');
      return;
    }
    state.seg = s;

    pageEl.innerHTML =
      '<div class="screen shared">' +
        '<div class="appbar"><span class="title" style="padding-left:12px">투자 스타일 분석</span></div>' +
        '<div class="body">' +
          '<p class="shared-kicker">공유받은 투자 스타일</p>' +
          '<h2 class="shared-title">이 투자 스타일은<br>어떤 특징이 있을까요?</h2>' +
          renderTypeSummary(s, false) +
          '<h3 class="sec-title">4가지 기준 축</h3>' +
          renderAxisCards(s, '해당') +
          '<h3 class="sec-title">이 투자 스타일의 특징</h3>' +
          '<div class="pc-list">' + renderStrengths(s) + renderCautions(s) + '</div>' +
          '<p class="privacy-note">공유 파일에는 투자 스타일 유형만 포함되며, ' +
            '설문 응답과 개인 거래정보는 포함되지 않습니다.</p>' +
        '</div>' +
        '<div class="footer-cta">' +
          '<button type="button" class="btn btn-primary" data-act="try-mine">나도 해보기</button>' +
        '</div>' +
      '</div>';

    on(qs('[data-act="try-mine"]', pageEl), 'click', startMySurveyFromSharedResult);
  }

  /* 공유 화면 → 내 설문 시작 */
  function startMySurveyFromSharedResult() {
    if (!guard()) return;
    state.sharedMode = false;
    state.ignoreEmbeddedShare = true;
    try { window.sessionStorage.setItem(CONFIG.SHARE_IGNORE_KEY, '1'); } catch (e) {}
    resetSurvey();                       /* namespaced 키만 삭제 */
    if (String(location.hash || '').indexOf('share=') !== -1) {
      try { history.replaceState(null, '', location.pathname + location.search); }
      catch (e) { try { location.hash = ''; } catch (e2) {} }
    }
    go('intro');
  }

  /* 이번 실행에서 공유 모드를 무시해야 하는가 */
  function shouldIgnoreShare() {
    if (state.ignoreEmbeddedShare) return true;
    try { return window.sessionStorage.getItem(CONFIG.SHARE_IGNORE_KEY) === '1'; }
    catch (e) { return false; }
  }

  /* 초기 진입 시 적용할 공유 코드를 판정한다.
       { code }      유효한 공유 코드
       { invalid }   공유 파일이지만 코드가 손상됨 → 오류 화면 대신 인트로
       null          일반 실행 (공유 아님) */
  function resolveShareCode() {
    if (shouldIgnoreShare()) return null;
    var invalid = false;

    var cfg = getEmbeddedShareConfig();
    if (cfg === null) {
      /* 설정 스크립트가 손상되어 파싱 실패 — 공유 파일일 수 있으므로 인트로로 */
      if (document.getElementById(CONFIG.SHARE_CONFIG_ID)) invalid = true;
    } else if (cfg.code != null && cfg.code !== '') {
      if (isValidSegmentCode(cfg.code)) {
        return { code: String(cfg.code).replace(/-/g, '').toUpperCase() };
      }
      if (window.console) console.warn('[aiStyle] 내장 공유 코드가 유효하지 않음:', cfg.code);
      invalid = true;
    }

    var h = getHashShareCode();
    if (h) {
      if (isValidSegmentCode(h)) return { code: String(h).replace(/-/g, '').toUpperCase() };
      if (window.console) console.warn('[aiStyle] 해시 공유 코드가 유효하지 않음:', h);
      invalid = true;
    }
    return invalid ? { invalid: true } : null;
  }

  /* =====================================================================
     초기화 / 딥링크
     ===================================================================== */
  function boot() {
    deviceEl = qs('#device');
    pageEl = qs('#page');
    overlayEl = qs('#overlay');
    popupHost = qs('#popup');
    toastEl = qs('#toast');
    if (!pageEl) return;

    /* 공유 파일로 열린 경우가 최우선 — 홈·인트로·세션 상태보다 앞선다 */
    var share = resolveShareCode();
    if (share && share.code) {
      state.sharedMode = true;
      state.seg = segByCode(share.code);
      state.page = 'shared';
      renderSharedResult(share.code);
      bindHistoryGuard();
      return;
    }
    if (share && share.invalid) {
      /* 공유 설정이 손상됨 — 오류 화면 대신 서비스 인트로로 안전하게 진입 */
      go('intro');
      bindHistoryGuard();
      return;
    }

    restore();

    var params;
    try { params = new URLSearchParams(location.search); }
    catch (e) { params = { get: function () { return null; } }; }

    var segParam = params.get('seg');
    var screen = params.get('screen');
    var themeParam = params.get('theme');

    var seg = segByCode(segParam);
    if (segParam && !seg) seg = defaultSeg();      /* 잘못된 코드 → 기본 데모 유형 */
    if (seg) state.seg = seg;

    var wantsResult = screen === 'result' || (!!segParam && !screen) || themeParam !== null;

    if (wantsResult) {
      if (!state.seg) state.seg = defaultSeg();
      state.page = 'intro';
      PAGES.intro();
      openResultModal();
      if (themeParam !== null) {
        var idx = parseInt(themeParam, 10);
        if (!isFinite(idx)) idx = 1;
        var themes = arr(state.seg && state.seg.themes);
        var t = themes[Math.min(Math.max(1, idx), themes.length) - 1];
        if (t) later(function () { openSheet(t, null); }, 60);
      }
    } else if (screen && PAGES[screen]) {
      if (screen === 'survey' || screen === 'loading') {
        if (!state.started) { state.started = true; persist(); }
        if (screen === 'loading' && !state.seg) state.seg = defaultSeg();
      }
      go(screen);
    } else {
      /* v1.12: 서비스 시작화면(인트로)으로 진입 — 뒤로가기로 홈 이동 가능 */
      go('intro');
    }

    bindHistoryGuard();
  }

  /* 브라우저·웹뷰 뒤로가기 → 설문 중단 확인과 연결 */
  function bindHistoryGuard() {
    try {
      history.replaceState({ aiStyle: 'root' }, '');
      window.addEventListener('popstate', onPopState);
    } catch (e) {}
  }

  function onPopState() {
    if (overlay.kind === 'modal') {
      if (sheetEl) closeSheet(); else closeResultModal();
      pushGuard();
      return;
    }
    if (state.page === 'survey') { confirmQuitSurvey(); pushGuard(); return; }
    if (state.page === 'intro') { pushGuard(); return; }   /* v1.15: 인트로가 루트 화면 */
    pushGuard();
  }
  function pushGuard() {
    try { history.pushState({ aiStyle: 'guard' }, ''); } catch (e) {}
  }

  /* --------------------------------------------------------- 개발용 API */
  function runValidation() {
    var errors = [], checked = 0;
    D.segments.forEach(function (s) {
      var where = s.code || s.flat || '?';
      try {
        if (!s.name) errors.push(where + ': 유형명 없음');
        if (!s.definition) errors.push(where + ': 설명 없음');
        if (String(s.flat || '').length !== 4) errors.push(where + ': 코드 길이 오류');
        if (arr(s.strengths).length < 1) errors.push(where + ': 강점 없음');
        if (arr(s.cautions).length < 1) errors.push(where + ': 유의점 없음');
        METRICS.forEach(function (m) {
          if ((s.behavior || {})[m.key] == null) errors.push(where + ': 지표 ' + m.key + ' 없음');
        });
        /* 축 하이라이트 정합성 */
        String(s.flat).split('').forEach(function (c, ai) {
          var ax = D.axes[ai];
          if (!ax || !arr(ax.poles).some(function (p) { return p.code === c; })) {
            errors.push(where + ': ' + (ax ? ax.name : ai) + ' 축 코드 불일치(' + c + ')');
          }
        });
        /* 렌더 검증 */
        var html = resultBody(s);
        if (html.indexOf('undefined') !== -1) errors.push(where + ': 렌더 결과에 undefined 포함');
        arr(s.themes).forEach(function (t) {
          if (!t.name) errors.push(where + '/테마: 이름 없음');
          /* v1.18: 보유 비중은 실집계 값 — 원천에 없는 테마(null)는 '집계 준비중'으로 허용 */
          if (typeof t.share !== 'number' && t.share !== null)
            errors.push(where + '/' + t.name + ': 비중 값 형식 오류');
          if (t.share < 0 || t.share > 100) errors.push(where + '/' + t.name + ': 비중 범위 오류');
          splitFlow(t, s);
          arr(t.stockIssues).forEach(function (g, gi) { issueCard(g, gi); });
        });
        checked++;
      } catch (e) {
        errors.push(where + ': 예외 ' + e.message);
      }
    });
    /* 채점 전수 검사 */
    var reach = {}, unmatched = 0;
    var n = D.questions.length;
    for (var m = 0; m < (1 << n); m++) {
      var ans = D.questions.map(function (q, qi) {
        return arr(q.options)[(m >> qi) & 1].code;
      });
      var seg = scoreAnswers(ans);
      if (!seg) unmatched++; else reach[seg.flat] = 1;
    }
    if (unmatched) errors.push('채점 미매칭 ' + unmatched + '건');
    if (Object.keys(reach).length !== D.segments.length) {
      errors.push('도달 불가 유형 존재 (' + Object.keys(reach).length + '/' + D.segments.length + ')');
    }
    var result = {
      segments: checked,
      combinations: 1 << n,
      reachable: Object.keys(reach).length,
      errors: errors,
      ok: errors.length === 0
    };
    if (window.console) console[errors.length ? 'warn' : 'log']('[aiStyle] 검증', result);
    return result;
  }

  var BUILD_TAG = (document.documentElement.getAttribute('data-build') || 'dev');
  if (window.console) console.info('[aiStyle] build ' + BUILD_TAG + ' · 유형 ' + D.segments.length +
    ' · 문항 ' + D.questions.length + ' · storage ' + (storage.available ? 'session' : 'memory'));

  window.__aiStyle = {
    build: BUILD_TAG,
    reset: function () { resetSurvey(); closeOverlay(true); go('intro'); },
    openResult: function (code) {
      var s = segByCode(code) || defaultSeg();
      state.seg = s;
      closeOverlay(true);
      state.page = 'intro';
      PAGES.intro();
      openResultModal();
      return s && s.code;
    },
    openTheme: function (idx) {
      if (overlay.kind !== 'modal') window.__aiStyle.openResult(state.seg && state.seg.flat);
      var themes = arr(state.seg && state.seg.themes);
      var t = themes[Math.min(Math.max(1, idx || 1), themes.length) - 1];
      if (t) openSheet(t, null);
      return t && t.name;
    },
    getState: function () {
      return {
        page: state.page, qi: state.qi, answered: answeredCount(),
        seg: state.seg ? state.seg.code : null,
        overlay: overlay.kind, sheetOpen: !!sheetEl,
        sharedMode: state.sharedMode,
        storage: storage.available ? 'sessionStorage' : 'memory'
      };
    },
    runValidation: runValidation,

    /* --- 공유 기능 개발용 --- */
    createShareFile: function (code) {
      /* 인자를 아예 넘기지 않은 경우에만 현재 결과 코드를 사용한다.
         빈 문자열·잘못된 값은 그대로 거부한다. */
      var c = (code === undefined) ? getCurrentSegmentCode() : code;
      if (!isValidSegmentCode(c)) return { ok: false, reason: 'invalid-code' };
      return createSharedHtmlFile(String(c).replace(/-/g, '').toUpperCase());
    },
    openSharedResult: function (code) {
      var c = String(code || CONFIG.DEFAULT_SEG).replace(/-/g, '').toUpperCase();
      closeOverlay(true);
      state.sharedMode = true;
      state.page = 'shared';
      renderSharedResult(c);
      return c;
    },
    validateShareFile: function (code) {
      var c = String(code || getCurrentSegmentCode() || '').replace(/-/g, '').toUpperCase();
      if (!isValidSegmentCode(c)) return { ok: false, problems: ['invalid-code'] };
      var made = createSharedHtmlFile(c);
      if (!made.ok) return { ok: false, problems: made.problems || [made.reason] };
      return validateSharedHtml(made.html, c);
    },
    go: go,
    data: D
  };

  /* boot 가 실패해도 빈 화면으로 끝나지 않도록 원인을 화면에 남긴다 */
  function safeBoot() {
    try {
      boot();
    } catch (e) {
      if (window.console) console.error('[aiStyle] boot 실패', e);
      var box = document.getElementById('boot-fallback');
      if (box) {
        box.style.borderColor = '#FBE3B8';
        box.style.background = '#FFF8EC';
        box.innerHTML = '<h1 style="font-size:18px;margin:0 0 10px;color:#B37211">화면을 실행하지 못했어요</h1>' +
          '<p style="font-size:14px;margin:0">' + String(e && e.message || e) +
          '<br><span style="color:#868E96">build ' +
          (document.documentElement.getAttribute('data-build') || 'dev') + '</span></p>';
      }
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', safeBoot);
  else safeBoot();
})();

</script>

<!-- 부팅 자가진단 : 무엇이 빠졌는지 화면에 직접 알려준다 -->
<script data-aistyle="boot">
(function () {
  function report(title, lines) {
    var box = document.getElementById('boot-fallback');
    if (!box) return;
    box.style.borderColor = '#FBE3B8';
    box.style.background = '#FFF8EC';
    box.innerHTML = '<h1 style="font-size:18px;margin:0 0 10px;color:#B37211">' + title + '</h1>' +
      '<ul style="margin:0;padding-left:18px;font-size:14px">' +
      lines.map(function (l) { return '<li>' + l + '</li>'; }).join('') + '</ul>';
  }
  function check() {
    var box = document.getElementById('boot-fallback');
    var problems = [];
    if (!window.APP_DATA) problems.push('데이터 파일(assets/js/data.js)을 불러오지 못했습니다.');
    if (!window.__aiStyle) problems.push('앱 스크립트(assets/js/app.js)를 불러오지 못했습니다.');
    var dev = document.getElementById('device');
    if (dev && getComputedStyle(dev).position !== 'relative') {
      problems.push('스타일 파일(assets/css/style.css)을 불러오지 못했습니다.');
    }
    var page = document.getElementById('page');
    if (!problems.length && page && page.innerHTML.trim() === '') {
      problems.push('화면이 그려지지 않았습니다. 브라우저 콘솔(F12)의 오류 메시지를 확인해 주세요.');
    }
    if (problems.length) {
      if (location.protocol === 'file:') {
        problems.push('<b>index.html 은 옆에 있는 assets 폴더가 함께 있어야 동작합니다.</b> ' +
          '압축 파일 안에서 바로 열었다면, 먼저 압축을 풀고 실행해 주세요.');
        problems.push('또는 폴더 없이 파일 하나로 실행되는 ' +
          '<b>AI투자스타일_맛보기_v1.11.html</b> 을 사용하세요.');
      }
      report('화면을 실행하지 못했어요', problems);
    } else if (box && box.parentNode) {
      box.parentNode.removeChild(box);      // 정상 실행 → 안내 제거
    }
  }
  window.addEventListener('error', function (e) {
    report('실행 중 오류가 발생했어요', [String(e.message || e.type), '브라우저 콘솔(F12)에서 상세 내용을 확인할 수 있어요.']);
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(check, 60); });
  else setTimeout(check, 60);
})();
</script>
